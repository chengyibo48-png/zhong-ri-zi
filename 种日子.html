    qiao:[['一块试验田','沈禾蹲在畦边，比划着两种播法。“有人觉得试验田只是在折腾，我想先种给他们看。”','先听听你想试什么。','我来记下每天的变化。','她把手册摊开，你们从一颗豆子开始讨论。','你在田边写下日期，她笑说终于有了搭档。'],['纸上的去留','外地单位又发来邀请。沈禾担心留下是赌气，离开又像否定这片土地。','出去学，再带办法回来。','留在这里也可以有新的尝试。','她决定先去短训，工作还是从村里的问题出发。','她把原计划缩成两块示范田，愿意慢慢证明。'],['把收成分出去','第一批毛豆熟了。沈禾想给食堂试菜，又怕大家只夸一句好吃。','一起称重，记下口味反馈。','请邻居边吃边提意见。','你们整理出一张容易读懂的轮作卡。','饭桌上有人提议轮流种一块，她终于松了口气。'],['一同往前种','沈禾把明年的种植本递给你：“有些位置，我想和你一起填。”','我愿意，想和你更亲近。','我珍惜这份伙伴情。','她在扉页写下你们的名字，约好都保留自己的节奏。','她认真点头，这份共同的农事仍会继续。'],['窗边的计划本','婚后第一个空闲晚间，沈禾带回一本新手册，也带回她想继续进修的消息。','我们各留一页，写自己的计划。','周末一起试一道新菜吧。','本子里并排留下了两个人的愿望，没有谁替谁做决定。','她答应带菜回来，你负责点火，两份工作都被生活好好接住。']],
    lin:[['放学后的植物课','林溪把孩子们的叶片画摆在河边。“课本上的植物，走出来才认得真。”','带孩子来小院看看。','我也画一张，跟着学。','她记下小院的位置，说会先问你哪天方便。','你画得有些歪，林溪却把它放进了示范册。'],['留在小学校','县城学校向林溪发来借调邀请。她舍不得孩子，也希望学到新的教法。','把机会当作一次来回的路。','可以先和同事商量轮岗。','她给校长写了带回乡土课程的计划。','她想试试轮流出去学习，让小学校也有新的风。'],['一餐植物课','林溪准备把认识作物与午饭连在一起，孩子们正等着摸摸真正的种子。','一起分种子，讲它们怎样长大。','我来做饭，你带孩子们观察。','你们用纸袋收好种子，把课堂接到了菜地。','饭香飘进教室，孩子们说原来认植物也能认一碗饭。'],['放学后等你','林溪停在院门口：“忙完学校，我越来越想知道你今天过得怎样。”','我也想把一天讲给你听。','我们一直做能谈心的朋友。','她笑着约了下一次散步，关系不必赶在钟声之前。','她收好你送的叶片书签，朋友之间也有长久的牵挂。'],['两张日程表','婚后的餐桌上放着两张日程表，林溪担心备课占去太多共处的时间。','挑一个都空闲的晚上。','各忙各的，留一盏晚归的灯。','你们圈出一顿周末饭，不把相处变成打卡。','她的教案旁多了一杯温水，工作和家都有自己的位置。']],
    zhou:[['山路上的新茶','周远带你闻今年的第一篓茶。“不是每片叶子都要做成最贵的茶。”','想听你说说日常喝的茶。','让我帮你把茶篓搬下去。','他讲起父亲每天泡的那一壶，声音放轻了。','山路并不长，两个人走就能多聊几句。'],['新的包装','周远试着网上卖茶，父亲却担心漂亮包装盖过了手艺。','让包装讲清茶从哪里来。','先请老客人尝，再慢慢改。','他把父亲的揉茶过程拍成小册页。','几位老客人的建议让父子俩终于坐到同一张桌前。'],['一壶给大家的茶','周远想在河边办一场不收费的小茶会，缺个愿意招呼新客的搭档。','一起摆茶碗。','带一份便当，请忙的人也来。','你们把高低不一的碗摆好，每一只都有来处。','木生叔端着饭坐下，话题从新茶聊到了小时候。'],['山路并行','回村途中，周远问：“以后这条路，你愿意和我经常一起走吗？”','愿意，也想走进你的生活。','愿意做彼此的老朋友。','他伸出手，仍让你决定走快还是走慢。','他笑着说好朋友也要常来喝茶。'],['自己的茶季','婚后采茶季很忙，周远把晚归时间写在门边，也问起你的安排。','忙完这阵再一起上山。','今晚就在院里喝一杯。','你们各有自己的忙碌，也认真约好团聚。','夜色里只沏半壶，能坐在一起就很好。']],
    mei:[['早市里的米香','方梅刚揭开蒸笼，第一批米糕有些裂。“每一批米都不一样，我还在学。”','尝一块，说说口感。','帮你记下今天的水量。','你们把失败的边角分着吃，甜味并没有少。','她把你写的纸贴在磨盘旁，说下次一起比较。'],['招牌留下什么','有人劝方梅做网红点心，她却想保留母亲留下的朴素米糕。','老做法可以有新的说明。','给两种点心各留一格。','她写下米糕的来历，让招牌有了自己的声音。','蒸笼里容得下两种选择，她不再逼自己只留一个。'],['试吃的小桌','方梅想办一次试吃，请老人和孩子都提意见。','把碗筷分好，我来招呼。','一起调一锅容易入口的米浆。','她听到了真实意见，也收到了许多愿意再来的笑脸。','你们把甜度减了一点，阿婆连说这样刚好。'],['收摊以后','方梅给你留了最后一块米糕：“我希望等的人，不只是买糕的客人。”','我想陪你走过收摊以后的日子。','我会一直是认真试吃的朋友。','她把围裙解下，第一次把回家的路走得很慢。','她拍掉你袖口的米粉，说这份友谊也很珍贵。'],['两个人的清晨','方梅婚后仍去店里开蒸笼，周末想晚一点起床，又担心老客等候。','把周末营业时间写清楚。','轮流安排一个不赶路的早晨。','门上多了一张告示，大家知道她也需要休息。','你们留出一顿慢早饭，各自的生活都不被抹去。']],
    ning:[['食堂的空格','宋宁拿着菜单，留了一格给老人们自己选。“我不想替每个人决定吃什么。”','问问他们最想念哪道菜。','试着备两种份量。','她记下的不只是菜名，还有许多家人的名字。','吃得少的人也能安心添饭，浪费反而少了。'],['被忽略的一餐','食堂账目紧，宋宁担心讲究营养会让大家觉得贵。','用当季菜做一次对比。','把采购和做法写出来。','便宜的豆子和叶菜成了新菜单的主角。','公开账本让邻居更理解她的取舍。'],['一份送到门口的饭','宋宁想给行动不便的老人试送午饭，需要有人帮她走一趟路线。','一起核对门牌和口味。','负责装盒，饭到时还热着。','你们画出一张简明送饭图，每个门口都有称呼。','老人打开盒子时笑了，她的忙碌有了落点。'],['空下来的那一格','宋宁把自己的晚饭计划递给你：“这一格，我想留给你。”','我想和你分享往后的饭桌。','我们做彼此可靠的朋友。','她不再只想着照顾别人，也开始说自己的喜好。','你们约好继续做饭友，不欠谁一个答案。'],['给自己盛一碗','婚后宋宁习惯先顾别人，你提醒她坐下吃自己的饭。','今天各说一件想做的事。','让我按你的口味做一次。','她说想学画画，你说出自己的愿望，饭桌第一次先照顾了你们。','她把碗捧在手里，说被记得也很暖。']],
    an:[['卫生室门口','顾安刚贴好休息日告示，仍有人来问旧处方。“我想把信息写得再明白一点。”','帮忙试读一下。','把常见问题整理成卡片。','你指出两个容易误解的词，他立刻换成了家常话。','梁医生看了卡片，说下次外出也能放心。'],['一个人的轮班','顾安常替人换班，却很少说自己的疲惫。','把需要休息的时间讲出来。','和同事商量轮换。','他第一次认真填了休假申请。','大家并不介意互相换班，他反倒松了一口气。'],['健康日的后勤','卫生室要做一次便民健康咨询，顾安请你帮忙安排等候和饮水。','把座位留给老人孩子。','我来准备大家的午饭。','院外没有催促，等候也可以很安静。','咨询结束时还有热饭，大家终于一起坐下。'],['下班后的一段路','顾安问你愿不愿意一起散步：“今天不聊工作，我想听你的事。”','我也想了解工作以外的你。','我们会是很好的朋友。','他讲起自己喜欢的旧电影，路灯下一切都平常又新鲜。','他点头，朋友之间也能认真倾听。'],['一盏晚归的灯','婚后顾安仍要值晚班，他不想让等待成为你的义务。','各自安排，想念时留便条。','约一个固定的共餐晚上。','门边的留言写着日常琐事，没人需要牺牲自己的安排。','一顿不被打扰的晚饭，比每天勉强凑在一起更珍贵。']],
    yu:[['河边的记录本','江渔在记录水位，纸角被风吹起。“我想让孩子知道河水是有变化的。”','画一张大家看得懂的图。','一起数今天见到的鱼。','水位标记贴在了河埠，路过的人也能看懂。','你们记下鱼的影子，留着下次对比。'],['热闹与安静','有人想把河边办得很热闹，江渔担心鱼和老人都少了安静的地方。','留出安静时段。','把活动和歇脚区分开。','大家同意晚间收声，河仍有自己的节奏。','一块小牌子就划清了边界，彼此不用争抢。'],['捡回一段清爽河岸','江渔组织一次自愿河岸整理，不比谁捡得多，只想让水边好走。','帮忙整理安全的步道。','给来帮忙的人准备饭。','你们把绕人的杂物收好，孩子可以安心走过。','每人端起一碗饭，劳动像一次邻里相聚。'],['把名字写在一页','江渔翻到记录本最后：“以后除了河水，我还想记我们的日子。”','我想和你一起记下去。','我们继续做并肩的朋友。','他在空白页上写下今天的天气，等你添上第一句话。','他把笔交给你，说朋友也属于这条河的故事。'],['轮流说晚安','婚后江渔照常巡河，回家时总带一个很小的观察。','我也讲一件今天的小事。','下个休息日一起走走。','两个人轮流说着无关紧要的事，日子因此变得具体。','你们在日历上圈了一个空白日，谁也不用赶路。']],
    yan:[['镜头之外','陆言把相机放下，帮陆师傅劈竹。“拍之前，我想先知道他们在忙什么。”','先坐下来听故事。','我来帮手，你也别急着拍。','镜头安静了一会儿，照片里的神情却更自然。','你们忙到傍晚，最后只拍了一张沾着竹屑的手。'],['谁的乡村照片','陆言收到宣传片邀请，却不喜欢稿子里一成不变的怀旧句子。','把当下的工作也拍进去。','请被拍的人挑自己的照片。','快递站、卫生室和食堂进入了画面。','每个人都选出自己喜欢的样子，照片不再替人发言。'],['村史角的一面墙','陆言准备把照片挂进村史角，想让照片旁边有当事人写的话。','一起校对名字与日期。','请大家带道菜，边吃边写。','那些平凡名字被端正地写下来，比展览标题更郑重。','一顿饭的工夫，照片边多了许多笑着讲出的往事。'],['留在画面里的你','陆言迟迟没有按快门：“比起拍下你，我更想和你一起生活。”','那么我们一起走进画面。','我愿做你长久的朋友。','你们并肩坐好，定时快门记下了一个普通却认真的下午。','他笑了，朋友也能让人安心地放下相机。'],['不用拍下的晚上','婚后陆言把相机收进柜子，问今晚是否只属于你们自己。','只聊一聊来年的打算。','一起整理屋里的旧物。','没有照片，你们仍会记得彼此说过的话。','旧物里夹着爷爷的便条，新日子和旧日子安静地连在一起。']]
  };

  Object.entries(romanceArcs).forEach(([id,rows])=>D.arcs[id]=rows.map((r,i)=>({id:id+'-'+i,title:r[0],text:r[1],choices:[{label:r[2],reply:r[4]},{label:r[3],reply:r[5]}],points:[0,15,35,55,75][i],needs:i===2?{greens:1}:null,kind:i===3?'confirmation':i===4?'married':'story'})));
  const supportStories={
    granny:['旧便条里的饭桌','阿婆翻出爷爷写的待客名单。纸边写着：“饭多一口，不怕。”','陪她认一认名单上的人。','把自己做的饭添进名单。','她讲起每个人年轻时的模样，旧院重新有了声音。','便条背面多了你的菜名，故事从怀念走向了今天。','留给后来的人','阿婆把一份荠菜团子的做法交给你，请你按自己的口味改一改。'],
    chen:['一把旧木尺','木生叔想教小河修东西，却总忍不住替孩子做完。','让小河先试一遍。','一起把步骤画下来。','他把尺子放下，看见儿子慢慢找到了自己的办法。','父子俩照着图各做一遍，终于笑着比较起误差。','可以传下去的手艺','木生叔给你做了一只小木盒：“你爷爷的尺子，也值得有人继续用。”'],
    xu:['柜台下的账本','许婶翻着寄售账本，想把口头约定整理得更清楚。','写一张人人看得懂的价目表。','请寄售的人一起核对。','价目表贴在门边，不熟悉的人也敢拿收成来卖。','有人发现自己还没领钱，大家的信任变得更踏实。','一间店的来往','许婶把第一张新账页给你看，留出一栏记录邻里的拿手菜。'],
    luo:['装种子的信封','罗素琴把种子装进旧信封，却发现去年没写清播种月份。','一起按季节整理。','请种过的人补上经验。','你们给每封种子写了简单的时令提示。','纸面多了不同人的笔迹，种子也有了各家的故事。','不只是交换种子','互助箱摆在小院边，罗素琴留给你一袋豆种，说不用急着还。'],
    liang:['药柜上的字','梁医生承认旧标签太小，可换标签总被日常工作打断。','一格一格换清楚。','先问老人哪里看不明白。','新的大字标签贴好，梁医生自己也看得轻松。','他发现熟悉的缩写并不适合每个人，决定重新写。','把经验交出去','梁医生请顾安主持下一次咨询，自己安心坐在后排帮忙。'],
    wu:['水渠的转弯处','吴大成带来旧水渠图，几处转弯已经和地面不一样。','沿渠走一遍做记号。','问问各家的用水习惯。','新图把容易堵住的弯角标清了。','大家提出轮流检查，比一个人天天跑更稳妥。','一桶不必着急的水','水渠修好后，他把简易蓄水图留给你，停水时也能从容安排。'],
    jiang:['戏台前的旧曲','江桂珍想恢复一场小演出，年轻人却怕唱错被笑。','先从大家会的半句唱起。','让说故事也成为节目。','有人先笑着开口，其他人很快接上。','台上多了修车和送包裹的故事，旧曲也有新味道。','唱给今天的村庄','江桂珍邀你站在台边敲拍子：“不必唱得最好，有声音就好。”'],
    zhouSenior:['茶篓里的留白','周明山不太理解儿子的网店，怕手艺只剩一个价钱。','请他说一段揉茶的故事。','一起看看客人真正问什么。','陆言把手艺拍下来，周远认真写进了说明。','父亲发现有人关心茶山和人，愿意慢慢学着回复。','不抢过孩子的手','他让周远独立定一次焙茶时间，自己在旁边泡了一壶日常茶。'],
    luSenior:['竹条弯下去','陆师傅准备开小课堂，担心孩子们把手磨疼。','先做一只最简单的风车。','准备可以反复试的边角料。','阿宝的风车转起来，大家都愿意再试一次。','竹编少了“做错”的压力，多了不停尝试的小手。','一只带回家的竹篮','陆师傅送你竹篮，说手艺有人使用才不会停在展柜里。'],

function buyback(s,key){const e=ensure(s),r=e.receipts.find(r=>r.key===key);if(!r||s.day-r.day>2)return no('这张回购货签已到期。');const cost=r.price+Math.max(1,Math.ceil(r.price*.05));if(s.money<cost)return no('回购需要 '+cost+' 元（原价加 5% 保管费，至少 1 元）。');if((s.bag[r.id]||0)+r.qty>999999)return no('背包这一类已满。');s.money-=cost;s.stats.earned=Math.max(0,s.stats.earned-r.price);restore(s,r,'bag',s.day-r.day);e.receipts.splice(e.receipts.indexOf(r),1);record(s,'回购',r.id,r.qty,-cost);return yes('取回原物，品质未变，陈放年龄正常累计。');}
function shopPrice(id){const d=D.items[id],base=d?.cost||(id==='rice'?24:0);return base?Math.max(base,Math.ceil(d.price*1.85)):0;}
function offers(s){const pool=Object.keys(D.items).filter(id=>shopPrice(id)&&!id.endsWith('_heirloom')&&!id.endsWith('_seasonal'));return [0,1,2].map(n=>pool[(s.day*7+n*11)%pool.length]).filter((id,i,a)=>a.indexOf(id)===i);}
function daily(s){const e=ensure(s);if(e.daily.day!==s.day)e.daily={day:s.day,bought:{}};return e.daily.bought;}
function purchase(s,id,n=1,special=false){if(!valid(id)||!int(n,1,99)||!shopPrice(id))return no('这件物品目前不出售。');const sold=daily(s),price=special?Math.max(Math.ceil(D.items[id].price*1.85),Math.floor(shopPrice(id)*.9)):shopPrice(id);if(special&&(!offers(s).includes(id)||(sold[id]||0)+n>5))return no('今日货签每种限 5 份，明日换新；普通货架仍可购买。');if(s.money<price*n)return no('零钱不足，需要 '+price*n+' 元。');if((s.bag[id]||0)+n>999999)return no('背包这一类已满。');const before=s.money,r=old.buy(s,id,n);if(!r.ok)return r;s.money=before-price*n;if(special)sold[id]=(sold[id]||0)+n;record(s,'买入',id,n,-price*n);return yes('买到'+D.items[id].name+' ×'+n+'，支出 '+price*n+' 元。');}
function send(s,id,n,grade,channel,theme='breakfast'){const e=ensure(s);if(!['coop','stall'].includes(channel)||!own(themes,theme)||!int(n,1,channel==='stall'?12:99))return no('合作社每批最多 99 份，摊位每批最多 12 份。');if(locked(s,id))return no('物品已锁定。');if(e.jobs.length>=(e.rep>=20?8:4))return no('货单已满，请先领取或撤回。');if(channel==='stall'&&e.jobs.some(j=>j.channel==='stall'))return no('先收好这一摊，再换主题开摊。');const q=quote(s,id,n,grade,channel,theme);if(!q?.available)return no('所选品质或数量不足。');if(channel==='stall'&&!C.labor(s,3,10))return no('先休息再整理摊位。');const packet=extract(s,id,n,grade),ready=channel==='coop'?(s.day+1)*1440+390:K.now(s)+90;e.jobs.push({key:e.nextId++,day:s.day,ready,channel,theme,price:q.money,...packet});record(s,channel==='coop'?'交代销':'摆摊',id,n,0);return yes(channel==='coop'?'已交合作社锁价代销，明早起可领取 '+q.money+' 元。':'竹匾摆好，等待 90 游戏分钟后回来收摊；预计 '+q.money+' 元。');}
function collect(s,key,cancel=false){const e=ensure(s),j=e.jobs.find(j=>j.key===key);if(!j)return no('这张货单已经处理过。');if(!cancel&&K.now(s)<j.ready)return no('货单还在办理，可以先去村里走走。');if(cancel){if((s.bag[j.id]||0)+j.qty>999999)return no('背包这一类已满。');restore(s,j,'bag',s.day-j.day);}else{if(s.money+j.price>1e9)return no('零钱已满。');income(s,j.price);if(j.channel==='coop')e.rep=Math.min(99999,e.rep+1);}e.jobs.splice(e.jobs.indexOf(j),1);record(s,cancel?'撤回':'结算',j.id,j.qty,cancel?0:j.price);return yes(cancel?'已退回原货，品质和陈放年龄保留。':'货款 '+j.price+' 元已收好。'+(j.channel==='coop'?'供货信用 +1。':''));}
function orders(s){const week=Math.floor(s.day/7),crops=Object.keys(D.crops).filter(id=>D.crops[id].seasons.includes(C.calendar(s).season)),ids=[crops[week%crops.length],['egg','milk','wool'][week%3],['flour','driedMushroom','berryJam'][week%3]];return ids.map((id,i)=>({key:week+'-'+i,id,qty:[8,5,3][i],grade:i===2?1:0,title:['食堂的时令篮','邻里早餐桌','乡味礼盒'][i],bonus:[25,30,40][i]}));}

function details(id){const d=D.items[id],uses=[];for(const r of D.recipes)if(r.ingredients[id])uses.push(D.items[r.id].name);for(const r of K.processing)if(r.needs[id])uses.push(D.items[r.out].name);for(const [key,t]of Object.entries(root.ZRZTools.defs))if(t.needs[id]||['wood','bamboo'].includes(id))uses.push(t.name+'改良');const crop=Object.values(D.crops).find(c=>c.seed===id)||D.crops[id],sources=d.kind==='种子'?'杂货货架、健康作物留种':crop?'四时农事种植':['milk','egg','duckEgg','wool','pork'].includes(id)?'东坡牧场照料与收取':['wood','bamboo','berry','tea','shoot','mushroom','wildHerb'].includes(id)?'村道周边采集':['fish','shrimp','crab','perch','loach'].includes(id)?'河岸垂钓':K.processing.some(r=>r.out===id)?'禾溪小灶加工':d.kind==='料理'?'灶边菜谱与试配':'商店与农场生产';return {category:category(id),sources,uses:[...new Set(uses)].slice(0,8),likes:D.npcs.filter(n=>n.likes.includes(id)).map(n=>n.name),shelf:K.food(id)?K.shelf(id):null};}
function sellBatch(s,lines){if(!Array.isArray(lines)||!lines.length||lines.length>12)return no('售货篮可装 1—12 条货签。');const projected=copy(s),before=s.money;for(const line of lines){const r=sale(projected,line.id,line.n,line.grade);if(!r.ok)return r;}Object.assign(s,projected);return yes('整篮已交柜台，收到 '+(s.money-before)+' 元；各批货签可单独回购。');}
const old={initial:C.initial,load:C.load,has:C.has,buy:C.buy,storage:C.storageMove,build:B.perform,preview:B.preview,destination:B.destination};

<script>
(function(root){

<script>
(function(root){

const C=root.ZRZCore,V=root.ZRZVillage,D=root.ZRZData,P=root.ZRZNpcContent;
const ids=D.npcs.map(n=>n.id),historyLimit=160,topics=['auto','daily','advice','memory'];
const ok=msg=>({ok:true,msg}),no=msg=>({ok:false,msg});
const homes=Object.fromEntries(D.npcs.map(n=>[n.id,V.homeOf(n.id)]));
const base=C.initial(),work=Object.fromEntries(D.npcs.map(n=>[n.id,V.workPoint(base,n)]));
const school=V.houses.find(h=>/小学/.test(h.name)),market=V.houses.find(h=>/杂货/.test(h.name));
for(const [id,name]of Object.entries({lin:'禾溪小学',chen:'竹木工坊',xu:'许婶杂货',mei:'方记米糕',ning:'邻里食堂',an:'村卫生室',liang:'村卫生室',tao:'乡村邮政',luSenior:'竹编作坊',luo:'种子互助屋'})){const h=V.houses.find(h=>h.name===name);if(h)work[id]=V.safePosition({village:{}},{x:h.door.x+(ids.indexOf(id)%3-1)*30,y:h.door.y+28});}
work.yu={x:749,y:2790};
const face=(p,q)=>{const dx=q.x-p.x,dy=q.y-p.y;p.direction=Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up';};
function ensure(s){
 const f=s.neighbors||={version:1,day:-1,people:Object.fromEntries(ids.map(id=>[id,{introduced:false,recent:[],last:null,event:null}])),history:[]};
 if(f.day!==s.day){f.day=s.day;if(s.day>=2)for(let j=0;j<2;j++){const id=ids[((s.day-2)*2+j)%ids.length],p=f.people[id],e=p.event;if(!e||e.status==='done'&&s.day-e.completed>=28)p.event={day:s.day,status:'offered',method:null,completed:null};}}
 return f;
}
function event(s,id){return ensure(s).people[id]?.event;}
function activity(s,id){
 const n=D.npcs.find(n=>n.id===id),i=ids.indexOf(id),h=homes[id],m=s.minutes,cal=C.calendar(s),e=event(s,id);
 const at=(key,label,target,gesture='read',room=null,reason='按平日作息')=>({key,label,target,gesture,room,reason});
 const home=(key,label,gesture,reason)=>at(key,label,h.door,gesture,h.id,reason);
 if(m<(id==='mei'?390:420+i%4*12)||m>=1140+i%4*12)return home('night','在家歇息','sleep','夜间回屋，明早再忙');
 if(root.ZRZEnvironment?.profile(s.day).shelter)return home('shelter','在家'+P[id].work,P[id].gesture,'风雨或寒冷天气，转为室内活动');
 if(cal.date===14&&m>=660&&m<1080){const center=market?.door||work.xu;return at('festival','准备'+D.festivals[cal.season],{x:center.x+(i%6-2)*30,y:center.y+80+Math.floor(i/6)*32},'fan','',D.festivals[cal.season]+'当天，去老街会合');}
 if(e&&e.status!=='done'&&['granny','zhouSenior','liang','song'].includes(id)&&m>=570&&m<960)return home('housework',P[id].request,P[id].gesture,'家中有件小事，可带材料或一起搭把手');
 if(m<510+i%3*20)return home('morning','准备出门 · '+P[id].work,P[id].gesture,'早起先整理手边东西');
 const lunch=720+i%3*20;if(m>=lunch&&m<lunch+65)return home('lunch','回家吃饭歇脚','tea','午饭和休息有自己的时间');
 if(n.tier==='child'&&s.day%7<5&&m<900&&school)return at('school','上课与自然观察',{x:school.door.x+(i%4-1.5)*28,y:school.door.y+30},'read',null,'平日先上学，放学后做自己的事');
 if(m<960){if(s.day%7===5&&['xu','mei','tao','song','luSenior','luo'].includes(id)){const c=market?.door||work.xu;return at('market','赶集 · '+P[id].work,{x:c.x+(i%5-2)*37,y:c.y+90+Math.floor(i/5)*20},P[id].gesture,null,'每周赶集日到老街照看摊位');}return at('work',P[id].work,work[id],P[id].gesture);}
 if(m<1080){const friend=D.links.find(([from])=>from===id)?.[1],other=homes[friend],center=other?.door||(s.projects.bridge?{x:1165,y:2800}:h.door);return at('visit',other?'在'+D.npcs.find(n=>n.id===friend).name+'门前聊家常':s.projects.bridge?'去修好的河埠歇脚':'在自家门前散步',{x:center.x+(i%3-1)*27,y:center.y+36},'tea',null,other?'忙完工作，沿路看看亲友':'傍晚留一点散步时间');}
 return home('evening','收好工具，准备晚饭','tea','晚间回到自己的小屋');
}
function near(s,id){const n=D.npcs.find(n=>n.id===id),p=n&&V.npcPoint(s,n);return !!p&&Math.hypot(s.player.x-p.x,s.player.y-p.y)<=80;}
function location(s,id){const p=s.village.npc[id],h=p.room&&homes[id],plan=activity(s,id),a=V.stateRuntime(s).actors[id];return {place:h?h.name:V.regionAt(p.x,p.y).name,activity:a?.walking?'沿路前往 · '+plan.label:plan.label,reason:plan.reason,plan};}
function entries(s){return ids.map(id=>({id,...location(s,id),event:event(s,id)}));}
function remember(s,id,key,text,category='日常',emotion='calm',choice=''){
 const f=ensure(s),p=f.people[id],record={id,key,day:s.day,minute:Math.floor(s.minutes),text,category,emotion,choice};
 p.last=record;p.recent=[...p.recent.filter(k=>k!==key),key].slice(-12);
 if(!f.history.some(r=>r.id===id&&r.day===s.day&&r.key===key&&r.choice===choice))f.history.push(record);
 f.history=f.history.slice(-historyLimit);const a=V.stateRuntime(s).actors[id];if(a){a.emotion=emotion;a.emotionUntil=V.stateRuntime(s).clock+7;}
 return record;
}
function candidates(s,id,topic='auto'){
 const n=D.npcs.find(n=>n.id===id),p=ensure(s).people[id],cal=C.calendar(s),plan=activity(s,id),r=s.relations[id],list=[];
 const add=(key,text,category='日常',emotion='calm')=>list.push({key,text,category,emotion});
 if(topic==='advice'){add('advice',P[id].advice,'线索','focus');return list;}
 if(topic==='memory'){
  if(p.event?.status==='done')add('help-memory-'+p.event.day,'上回'+P[id].request+'，你'+(p.event.method==='supply'?'把材料送来了':'留下来一起做完了')+'。那一点照应，我记着呢。','回忆','happy');
  const st=s.stories[id];if(st?.step){const e=D.arcs[id][st.step-1];add('story-memory-'+st.step,e.choices[st.choices.at(-1)].reply,'回忆','happy');}
  if(r.gifted>=0&&r.gifted<=s.day&&s.day-r.gifted<=7)add('gift-memory-'+r.gifted,'前些天你带来的那份心意，我收好了。空手来聊聊天，也一样欢迎。','回忆','happy');
  if(!list.length)add('new-memory','咱们还可以慢慢熟悉。今天遇见，说几句话，就是一件新记忆。','回忆');return list;
 }
 if(topic==='auto'){
  const ready=C.storyReady(s,id);if(ready.ok)add('story-'+s.stories[id].step,'我有件近况想和你商量：“'+D.arcs[id][s.stories[id].step].title+'”。你愿意听时，我们再慢慢聊。','故事','thought');

  }
  function finishTyping(){clearInterval(typeTimer);typeTimer=null;document.querySelectorAll('.typed-text').forEach(el=>{if(el.dataset.fullText)el.textContent=el.dataset.fullText;});document.querySelector('[data-action="e-reveal"]')?.remove();}
  function mount(s){clearInterval(typeTimer);const el=document.querySelector('.typed-text');if(el&&s.settings.textSpeed!=='instant'){const text=el.textContent;el.dataset.fullText=text;el.textContent='';let i=0;const skip=document.createElement('button');skip.className='mini-btn';skip.dataset.action='e-reveal';skip.textContent='立即显示全文';el.after(skip);typeTimer=setInterval(()=>{if(!el.isConnected){clearInterval(typeTimer);return;}el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);skip.remove();}},s.settings.textSpeed==='slow'?60:25);}for(const k of ['shirt','hair','skin']){const input=document.getElementById('appearance-'+k);if(input)input.value=s.appearance[k];}}
  root.ZRZPanels={panels,render,after,dispatch,mount};
})(window);

</script><script>
(function(root){

function seedOptions(s){return Object.entries(D.crops).map(([id,c])=>[id,c.name+' · '+(s.bag[F.seedId(id,s.farm.seedKind)]||0)+' 份']);}

 h+='<div class="farm-seed-summary"><strong>现在选好：'+D.crops[s.seed].name+' · '+F.kinds[s.farm.seedKind].name+'</strong><span>背包 '+(s.bag[F.seedId(s.seed,s.farm.seedKind)]||0)+' 份</span>'+btn('拿起种子袋','equip')+'</div><div class="inventory-grid">';
 h+=Object.entries(D.crops).map(([id,c])=>{const inSeason=c.seasons.includes(C.calendar(s).season),k=s.farm.seedKind,item=F.seedId(id,k),locked=k==='heirloom'&&s.day<14&&s.relations.qiao.points<20;return '<article class="item-card '+(id===s.seed?'farm-selected':'')+'"><div class="item-head"><canvas data-item="'+id+'" width="40" height="40"></canvas><strong>'+c.name+'</strong><span class="tag">'+(inSeason?'当季':'非当季')+'</span></div><p>'+c.days+' 天起 · 偏爱'+F.soils[F.profile(id).preferred].name+'<br>'+c.seasons.map(v=>D.seasons[v]).join(' / ')+' · '+c.group+'</p><small>持有 '+(s.bag[item]||0)+' 份 · '+(locked?'春十五或与沈禾熟悉后可购良种':'种子 '+D.items[item].cost+' 元 / 份')+'</small><div class="button-row">'+btn('选择','seed',id)+btn('购 1 份','buy',item,locked?'disabled':'')+btn('购 5 份','buy',item,'data-qty="5" '+(locked?'disabled':''))+'</div></article>';}).join('')+'</div>';return h;

function field(s){const i=ui.index,p=s.plots[i],b=s.farm.beds[i],r=F.preview(s,i),st=F.stage(s,i),cover=F.coverage(s,i),crop=p.crop?D.crops[p.crop]:null;
 let h='<div class="farm-detail-title"><span class="eyebrow">'+fieldName(i)+'</span><h2>'+(crop?crop.name:'等一颗种子的土地')+'</h2><span class="tag">'+st+'</span>'+btn('走到田边','walk',i)+'</div>';

 if(crop){const k=Math.min(100,p.growth/crop.days*100);h+='<div class="farm-growth"><div class="farm-meter"><i style="width:'+k+'%"></i></div><span>种子 → 萌芽 → 幼苗 → 生长 → 开花 → 成熟</span><p>'+Math.round(k)+'% · '+(k>=100?'最佳采收窗口剩余 '+Math.max(0,4-b.ripeDays)+' 天；过期仍可收或留种':'预计还需约 '+Math.ceil((crop.days-p.growth)/(b.health<22?.3:.85))+' 天，随水土天气调整')+'</p></div>';}
 h+='<div class="farm-advice"><strong>今天看看这里</strong><ul>'+F.advice(s,i).map(t=>'<li>'+t+'</li>').join('')+'</ul></div>';

 if(r)h+='<div class="farm-harvest-preview">采收预览 <strong>'+r.qty+' 份 · '+F.grades[r.grade]+'</strong><small>专门留种：'+((b.health>=60?2:1)+(b.health>=75&&b.ripeDays>=4&&b.ripeDays<=8?1:0))+' 份 '+D.items[r.seed].name+'。持续照料决定品质。</small></div>';
 const action=(text,a,disabled=false)=>btn(text,'task',i,'data-op="'+a+'" '+(disabled?'disabled':''));
 h+='<div class="farm-actions">'+action('挥锄开垦 · 3 力','hoe',p.tilled&&!b.removed)+action('播种 · 2 力','sow',!!p.crop||!p.tilled)+action('浇一壶 · 2 力','water',!p.tilled)+action('疏沟排水 · 2 力','drain',b.moisture<=60)+action('收获 · 2 力','harvest',!crop||p.growth<crop.days)+action('专门留种 · 2 力','seedSave',!crop||p.growth<crop.days)+'</div>';
 h+='<details class="farm-more"><summary>施肥、护苗与土地整治</summary><div class="farm-actions">'+action('熟堆肥 ×1 · 2 力','fertilize')+action('缓释肥 ×1 · 2 力','slow')+action('绿肥翻埋 · 豆种 ×1','green',!!p.crop)+action('拔草 · 2 力','weed')+action('人工捉虫 · 3 力','manual')+action('草本护苗 ×1 · 2 力','bio')+action('速效处理 ×1 · 品质 −8','agent')+action('深耕 · 4 力','deep',!!p.crop)+action(b.fallow?'结束休耕':'休耕养地 · 2 力','fallow',!!p.crop)+action('撤去空田垄 · 可修复','remove',!!p.crop)+'</div><div class="farm-controls"><label>改良土质'+select('farm-soil',Object.entries(F.soils).map(([id,v])=>[id,v.name]),b.type)+'</label>'+btn('换土 · 堆肥 ×2 +20 元','soil',i,p.crop?'disabled':'')+'</div></details>';
 h+='<details class="farm-more"><summary>套种与留种设置</summary><p>同一垄最多两种作物。豆类搭配其他科、叶菜搭配根菜有互助；同科套种会争肥，不能叠种。瓜豆攀架、架下叶菜有微荫。先收主作物后，副作物会继续长大。</p>'+selection(s)+(b.companion?'<p>垄旁：'+D.crops[b.companion.crop].name+' · '+Math.round(b.companion.growth/D.crops[b.companion.crop].days*100)+'%</p>'+action('收下套种作物','companionHarvest'):action('用选中的种子套种 · 2 力','companion',!p.crop))+btn(s.farm.autoSeed?'自动留一份种子：开':'自动留一份种子：关','auto-seed')+'</details>';return h;
}
function infrastructure(s){const i=ui.index;let h='<h2>'+fieldName(i)+' · 田埂设施</h2><p>每处田埂最多两座。只照料范围内的田块，耐久为零时停用；台风磨损更快。</p><div class="farm-controls">'+btn(s.farm.overlay?'关闭地面覆盖线':'显示地面覆盖线','overlay')+btn('储水 '+s.farm.water+' / 120 · 补满 6 元 +3 力','fill')+'<label>喷灌水分阈值'+select('farm-threshold',[[30,'低于 30'],[40,'低于 40'],[55,'低于 55'],[65,'低于 65']],s.farm.threshold)+'</label>'+btn('设置阈值','threshold')+'</div>';
 for(const[id,v]of Object.entries(F.facilities)){const a=s.farm.facilities.find(f=>f.anchor===i&&f.type===id),stored=s.toolkit?.stock.find(f=>f.type===id);h+='<article class="row-card"><div class="row-text"><h3>'+v.name+' <span class="tag">覆盖 '+s.plots.filter((_,j)=>{const center=V.plotPosition(i),point=V.plotPosition(j);return Math.hypot(center.x-point.x,center.y-point.y)<=(root.ZRZTools&&a?root.ZRZTools.radius(a):v.radius);}).length+' 块田</span></h3><p>'+v.description+'<br>'+(a?'耐久 '+a.durability+' / 100 · '+(a.enabled?'使用中':'已暂停'):(stored?'重放已收设施；免材料与资金，保留耐久 '+stored.durability+' 与改良':(s.furniture[id]||0)>0?'使用已有家具 ×1；免材料与资金':v.cost+' 元 · '+Object.entries(v.needs).map(([k,n])=>D.items[k].name+' ×'+n).join('、'))+(v.day?' · 第三季解锁':''))+'</p></div><div class="row-actions">'+(a?btn('修理 · 木材 ×1 +5 元','facility',i,'data-type="'+id+'" data-mode="repair"')+btn(a.enabled?'暂停':'启用','facility',i,'data-type="'+id+'" data-mode="toggle"')+'<label>搬往田号<input class="farm-target" id="move-'+id+'" type="number" min="1" max="72" value="'+(i+1)+'"></label>'+btn('搬动 · 2 力','facility',i,'data-type="'+id+'" data-mode="move"'):btn(stored?'重放 · 2 力':'安置 · 3 力','facility',i,'data-type="'+id+'" data-mode="build" '+(v.day&&s.day<v.day&&!stored?'disabled':'')))+'</div></article>';}
 h+='<div class="button-row"><button class="secondary" data-action="tools">工具与设施 · 预览、改良和回收</button></div><h3>已建 '+s.farm.facilities.length+' 座</h3><div class="button-row">'+s.farm.facilities.map(a=>btn(fieldName(a.anchor)+' · '+F.facilities[a.type].name,'inspect',a.anchor)).join('')+'</div>';return h;
}
function guide(s){return '<div class="farm-guide"><h2>会呼吸的田地</h2><p>松土、播种、照料、看天、采收、留种，再让土地歇一歇。成长以每天结算为准，生活簿打开时会暂停时光。</p><h3>看得见的变化</h3><p>田里的六个生长阶段会改变形态。蓝色水滴表示润湿，褐色裂纹表示干燥，黄边叶片表示萎蔫，黑色小虫／叶斑提示风险；成熟田垄会闪光。没有倒计时逼迫：失照只会拖慢生长，萎蔫可以救回，晚收也仍有收成。</p><h3>水土与轮作</h3><p>水田土适合稻、藕、芋；沙壤土适合根菜；腐殖土适合叶菜。肥力低时用熟堆肥，缓释肥分五天供肥，空地可翻埋豆种或休耕。连续同科、密植和潮湿更容易出问题。不是所有地都要每天浇水。</p><h3>四档品质</h3><p>普通 / 优质 / 上品 / 珍品，售价分别为基础的 1 / 1.2 / 1.4 / 1.7 倍。普通食材能完成原有菜谱与订单；品质随物品存取，优先消耗普通。全用优质食材做即时料理可额外提升料理一档。图鉴保留最高收获品质。</p><h3>病虫害可以缓解</h3><p>幼虫、叶斑分开记录；15 以下轻微、15—44 提醒、45—69 较重、70 以上优先照料。高密同科、连作、湿热、弱土会增加风险，严重邻田会小范围传染。人工捉虫省材料，草本护苗兼治叶斑，速效处理更强但本茬品质评分减 8。稻草人只驱鸟。</p><h3>种子与设施</h3><p>春十五或与沈禾熟悉后能买乡传良种；健康的上品收成专门留种也可得到良种；成熟后第 4—8 天、健康达到 75，专门留种多一份。节令种可直接购买。开启自动留种后，每次采收另留一份原品种种子。喷灌用水箱储水，设施仅在田埂附近生效，可以搬动、修理、暂停。</p><h3>批量照料</h3><p>先按区域、作物和状态筛选，再预览任务与材料。开始后角色逐块走到田边做动作；体力或材料不足会停止并保留已完成部分，方向键或“停止带路”可取消。</p></div>';}
function render(s,A){
 F.ensure(s);ui.index=Math.max(0,Math.min(s.plots.length-1,ui.index));const ids=F.list(s,ui.filter,ui.region,ui.crop);
 let h='<div class="farm-book">'+A.head('禾溪 · 四时农事','种下期待，照料有度。每块田都有自己的水土与节奏。');
 h+='<div class="farm-overview">'+[['ready','熟了',F.list(s,'ready').length],['dry','待补水',F.list(s,'dry').length],['risk','需留意',F.list(s,'risk').length],['all','全部田地',s.plots.length]].map(([k,t,n])=>'<button data-action="f-filter" data-id="'+k+'" class="'+(ui.filter===k?'active':'')+'"><strong>'+n+'</strong><span>'+t+'</span></button>').join('')+'</div>';

 h+='<div class="farm-controls"><label>片区'+select('farm-region',[['all','全部田地'],['home','稻香小院 · 24 块'],['pasture','东坡新田 · 48 块']],ui.region)+'</label><label>按作物'+select('farm-crop',[['all','全部作物'],...Object.entries(D.crops).map(([id,c])=>[id,c.name])],ui.crop)+'</label>'+btn('应用筛选','filters')+btn('仅看待播地','filter','empty')+'</div>';
 h+='<div class="farm-layout"><aside class="farm-map-wrap"><div class="farm-map-head">田亩索引 <small>'+ids.length+' 块符合筛选</small></div><div class="farm-map">';
 for(let i=0;i<s.plots.length;i++){const p=s.plots[i],b=s.farm.beds[i],ready=p.crop&&p.growth>=D.crops[p.crop].days;h+='<button class="farm-cell '+(ids.includes(i)?'':'dim ')+(ui.index===i?'selected ':'')+(ready?'ready ':p.crop?'growing ':'')+'" data-action="f-inspect" data-id="'+i+'" title="'+fieldName(i)+' · '+F.stage(s,i)+'" aria-label="'+fieldName(i)+' '+F.stage(s,i)+'"><span>'+String(i+1).padStart(2,'0')+'</span><b>'+(ready?'✦':b.pests>=15||b.disease>=15?'!':p.crop?'芽':p.tilled?'田':'·')+'</b><i style="width:'+b.moisture+'%"></i></button>';}
 h+='</div><p class="farm-map-key">✦ 可采收　芽 生长中　! 病虫提醒<br>01—24 小院　25—72 东坡<br>蓝线：水分 · 点选查看，角色不会传送</p><div class="farm-batch"><strong>对筛选结果批量安排</strong>'+[['water','补水'],['fertilize','堆肥'],['sow','播种'],['harvest','采收']].map(([id,t])=>btn(t,'batch',id)).join('')+'</div>';
 if(ui.batch){const tasks=F.plan(s,ids,ui.batch),n=tasks.length,material=ui.batch==='sow'?D.items[F.seedId(s.seed,s.farm.seedKind)].name+' ×'+n*(s.farm.density==='dense'?2:1):ui.batch==='fertilize'?'熟堆肥 ×'+n:'无需材料';h+='<div class="farm-batch-preview"><b>'+n+' 块可安排</b><p>最多 '+n*2+' 体力 · 当前 '+Math.floor(s.stamina)+'（特长可减免）<br>'+material+'<br>按序走到田边执行；途中可取消。</p>'+btn('开始这一批','batch-start',ui.batch,n?'':'disabled')+'</div>';}
 h+='</aside><section class="farm-main"><div class="tabs">'+[['field','这块田'],['seeds','种子袋'],['facilities','田埂设施'],['guide','农事手册']].map(([id,t])=>btn(t,'tab',id,ui.tab===id?'aria-current="page"':'')).join('')+'</div>';
 h+=ui.tab==='field'?field(s):ui.tab==='seeds'?seeds(s,A.head):ui.tab==='facilities'?infrastructure(s):guide(s);
 h+='</section></div><details class="farm-more"><summary>农资补给与收获图鉴</summary><div class="button-row">'+['compost','slowFertilizer','bioCare','plantCare','beanSeed'].map(id=>btn(D.items[id].name+' · '+D.items[id].cost+' 元（有 '+(s.bag[id]||0)+'）','buy',id)).join('')+'</div><p>'+Object.entries(s.farm.collection).map(([id,g])=>D.crops[id].name+' · '+F.grades[g-1]).join('　')+'</p></details></div>';return h;
}
const oldRender=X.render,oldDispatch=X.dispatch,oldAfter=X.after;
X.render=(name,arg,s,A)=>{if(name==='farmcare'){if(Number.isInteger(arg))ui.index=arg;return render(s,A);}if(name==='seeds')return seeds(s,A.head);return oldRender(name,arg,s,A);};
X.dispatch=(a,id,data,ctx)=>{
 if(!a.startsWith('f-'))return oldDispatch(a,id,data,ctx);
 const{s,apply,open,render:refresh,save,update,toast,close,queueFarm,equipSeed}=ctx;F.ensure(s);const use=r=>{apply(r);refresh();},store=()=>{save();update();refresh();},task=(op,arg,index=Number(id))=>{queueFarm([{index,action:op,arg}]);};
 if(a==='f-filter'){ui.filter=id;ui.batch=null;refresh();}
 if(a==='f-filters'){ui.region=val('farm-region');ui.crop=val('farm-crop');ui.batch=null;refresh();}
 if(a==='f-inspect'){ui.index=Number(id);open('farmcare');}
 if(a==='f-tab'){ui.tab=id;refresh();}
 if(a==='f-selection'){s.seed=val('farm-seed');s.farm.seedKind=val('farm-kind');s.farm.density=val('farm-density');store();toast('种子与株距已经记好。');}
 if(a==='f-seed'){s.seed=id;store();}
 if(a==='f-equip'){equipSeed();close();}
 if(a==='f-buy'){if(id.endsWith('_heirloom')&&s.day<14&&s.relations.qiao.points<20)toast('春十五或与沈禾熟悉后开放。',true);else use(C.buy(s,id,Number(data.qty)||1));}
 if(a==='f-task'){task(data.op,['sow','companion'].includes(data.op)?{crop:s.seed,kind:s.farm.seedKind,density:s.farm.density}:undefined);}
 if(a==='f-soil')task('soil',val('farm-soil'));
 if(a==='f-facility')task('facility',{type:data.type,mode:data.mode,target:Number(val('move-'+data.type))-1});
 if(a==='f-fill'){task('fill',null,ui.index);}
 if(a==='f-walk')task('inspect');
 if(a==='f-auto-seed'){s.farm.autoSeed=!s.farm.autoSeed;store();}
 if(a==='f-overlay'){s.farm.overlay=!s.farm.overlay;store();}
 if(a==='f-threshold'){s.farm.threshold=Number(val('farm-threshold'));store();}
 if(a==='f-batch'){ui.batch=id;refresh();}
 if(a==='f-batch-start'){const tasks=F.plan(s,F.list(s,ui.filter,ui.region,ui.crop),id);ui.batch=null;queueFarm(tasks);}
 return true;
};
X.after=(name,s,A)=>{if(name==='bag')return '<div class="paper-note">品质：优质 +20% · 上品 +40% · 珍品 +70%。使用与出售优先普通品质。'+Object.entries(s.quality).filter(([,q])=>q.some(n=>n>0)).map(([id,q])=>'<br>'+D.items[id].name+' · '+F.grades.slice(1).map((g,i)=>g+' '+(q[i]||0)).join(' / ')).join('')+'</div>'+A.button('存取与拆分物品','storage','','secondary');return oldAfter(name,s,A);};
})(window);


</script><script>
(function(root){
'use strict';
const R=root.ZRZRanch,C=root.ZRZCore,D=root.ZRZData,V=root.ZRZVillage,X=root.ZRZPanels,F=root.ZRZFarming;
const ui={tab:'animals',filter:'all',selected:'hen',batch:null,confirm:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>document.getElementById(id)?.value;
const btn=(label,action,id='',extra='')=>'<button class="mini-btn" data-action="r-'+action+'" data-id="'+esc(id)+'" '+extra+'>'+label+'</button>';
const select=(id,options,value)=>'<select id="'+id+'">'+options.map(([k,n])=>'<option value="'+esc(k)+'" '+(k===value?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
const metric=(label,n,color)=>'<div class="ranch-metric"><span>'+label+' <b>'+Math.round(n)+'</b></span><i><em style="width:'+n+'%;background:'+color+'"></em></i></div>';
const portrait=a=>'<canvas width="144" height="108" data-ranch-animal="'+esc(a.id)+'" aria-label="'+esc(a.name)+'的像素肖像"></canvas>';
const filtered=s=>s.animals.filter(a=>ui.filter==='all'||a.type===ui.filter||ui.filter==='ready'&&(a.ready||a.feathers)||ui.filter==='care'&&(a.hunger<40||a.illness>=20||a.clean<45||a.lost));
function detail(s,a){if(!a)return '<div class="paper-note">牧场还很安静。到畜舍页修整小屋，再迎接新伙伴。</div>';const sp=R.species[a.type],b=s.ranch.barns[sp.home],need=Math.ceil(sp.feed*R.breeds[a.breed].feed),preg=s.ranch.births.find(x=>x.mother===a.id);
 let h='<div class="ranch-profile">'+portrait(a)+'<div><span class="eyebrow">'+R.barns[sp.home].name+' / '+R.breeds[a.breed].name+'</span><h2>'+esc(a.name)+' <small>'+(a.sex==='female'?'母':'公')+sp.name+'</small></h2><p>'+R.stage(a)+' · '+a.age+' 日龄 · '+R.traits[a.trait]+' · 第 '+a.generation+' 代</p><span class="tag">'+(a.position.room?'在畜舍休息':a.lost?'南坡待接回':'在村里活动')+'</span></div></div>';
 h+='<div class="ranch-metrics">'+metric('饱食',a.hunger,'#bc9b57')+metric('健康',a.health,'#719673')+metric('心情',a.mood,'#c39478')+metric('洁净',a.clean,'#76a3a5')+metric('亲近',a.bond,'#bc827c')+metric('压力',a.stress,'#ad9a80')+'</div>';
 h+='<div class="ranch-note"><b>今天看看它</b><p>'+R.status(s,a).map(esc).join('<br>')+'</p><small>每次需 '+need+' 份饲料 · '+(a.sex==='male'&&!['sheep','pig'].includes(a.type)?'公畜陪伴与参与繁育，不生产蛋奶':!R.mature(a)?'距成年约 '+Math.ceil(sp.adult-a.age)+' 天':a.retired?'颐养中':(a.ready?'产物可收，':'')+'下次产出约 '+Math.max(1,Math.ceil((sp.cycle-a.progress)/R.breeds[a.breed].rate))+' 个照料良好的日子')+(preg?'<br>孕育中：还需 '+preg.remaining+' 个舒适日':'')+'</small></div>';
 h+='<div class="ranch-stock">'+a.qualityStock.map((n,g)=>'<span>'+F.grades[g]+' <b>'+n+'</b></span>').join('')+(a.feathers?'<span>羽毛 <b>'+a.feathers+'</b></span>':'')+'</div>';
 const action=(label,op,disabled=false)=>btn(label,'task',a.id,'data-op="'+op+'" '+(disabled?'disabled':''));
 h+='<div class="ranch-actions">'+action('走近喂食','feed',a.hunger>=90||a.care.feed===s.day)+action('轻轻摸摸','pet',a.care.pet===s.day)+action('梳洗皮毛','clean',a.clean>=95)+action({hen:'拾取鸡蛋',duck:'拾取鸭蛋',cow:'挤一桶鲜奶',sheep:'轻轻剪羊毛',pig:'收圈肥与菌子'}[a.type],'collect',!a.ready&&!a.feathers)+action('药物护理','treat',a.health>=95&&!a.illness)+action('请兽医 · 35 元','vet',a.health>=95&&!a.illness)+action(a.rest?'恢复放牧':'安排休养','rest')+(a.lost?action('带回畜舍','rescue'):'')+'</div>';
 h+='<details class="ranch-more"><summary>名字、照料安排与送养</summary><div class="farm-controls"><input id="ranch-name" maxlength="12" value="'+esc(a.name)+'" aria-label="伙伴名字">'+btn('改个名字','rename',a.id)+action(a.retired?'恢复生产':'安心颐养','retire')+'</div><p>送养到邻村后保留记录，有空位可按原补贴金额接回。孕育中的亲本先留下照料。</p>'+btn('安排送养','rehome',a.id)+(ui.confirm===a.id?'<div class="ranch-note">确认把 '+esc(a.name)+' 送到邻村牧场？补贴 '+Math.round(sp.cost*.4)+' 元。'+btn('确认送养','confirm',a.id)+btn('再陪一阵','cancel')+'</div>':'')+'</details>';
 return h;
}
function animals(s){const list=filtered(s);if(!list.some(a=>a.id===ui.selected))ui.selected=list[0]?.id;const a=list.find(v=>v.id===ui.selected);
 let h='<div class="ranch-filter">'+[['all','全部'],...Object.entries(R.species).map(([id,v])=>[id,v.name]),['ready','待收产'],['care','需留意']].map(([id,n])=>btn(n,'filter',id,ui.filter===id?'aria-current="page"':'')).join('')+'</div><div class="ranch-layout"><aside><div class="ranch-roster">';
 h+=list.map(a=>'<button class="ranch-card '+(a.id===ui.selected?'active':'')+'" data-action="r-select" data-id="'+a.id+'">'+portrait(a)+'<span><b>'+esc(a.name)+'</b><small>'+R.species[a.type].name+' · '+R.stage(a)+'</small><small>'+((a.ready||a.feathers)?'✦ 可以收产':a.lost?'! 等你接回':a.illness>=20?'! 需要护理':'饱食 '+Math.round(a.hunger))+'</small></span></button>').join('');
 h+='</div><div class="ranch-batch"><b>给当前筛选安排一批</b><div class="button-row">'+[['feed','添料'],['collect','收产'],['clean','梳洗'],['treat','护理']].map(([op,n])=>btn(n,'batch',op)).join('')+'</div>';
 if(ui.batch){const tasks=R.plan(s,list.map(a=>a.id),ui.batch),n=tasks.length,total=ui.batch==='feed'?tasks.reduce((sum,t)=>{const a=s.animals.find(v=>v.id===t.animalId);return sum+Math.ceil(R.species[a.type].feed*R.breeds[a.breed].feed);},0):ui.batch==='treat'?n:0;h+='<div class="ranch-note">'+n+' 位伙伴 · 最多 '+n*2+' 体力<br>'+ (total?D.items[ui.batch==='feed'?s.ranch.feed:'animalMedicine'].name+' ×'+total:'无需材料')+'<p>逐只走近照料，必要时进屋。材料不足会停止，方向键可取消。</p>'+btn('开始这批照料','batch-start',ui.batch,n?'':'disabled')+'</div>';}
 h+='</div></aside><section class="ranch-detail">'+detail(s,a)+'</section></div>';return h;
}
function housing(s){let h='<div class="ranch-barns">';
 for(const[id,def]of Object.entries(R.barns)){const b=s.ranch.barns[id],group=R.residents(s,id),act=(name,op)=>btn(name,'barn',id,'data-op="'+op+'"');h+='<article class="ranch-barn"><div class="ranch-barn-top"><span>'+{poultry:'禾草巢箱',cattle:'青瓦牛棚',sheepfold:'暖草羊圈',pigpen:'泥塘小院'}[id]+'</span><h3>'+def.name+'</h3><b>'+group.length+' / '+R.capacity(s,id)+' 床位'+(R.reserved(s,id)?' · 预留 '+R.reserved(s,id):'')+'</b></div><p>'+ (b.built?'洁净 '+Math.round(b.clean)+' · 维护 '+Math.round(b.durability)+' · 圈肥 '+b.waste:'待修缮：'+def.cost+' 元、木料 '+def.wood+'、竹材 4')+'</p>';
 h+='<button class="mini-btn" data-action="v-walk-house" data-id="'+def.house+'">进屋看看</button>';if(!b.built)h+=act('走去修好畜舍','build');else{h+='<div class="ranch-upgrades">'+[['space','扩容'],['comfort','暖巢垫床'],['protection','排水围护'],['efficiency','收集工位']].map(([k,n])=>act(n+' '+b[k]+'/3 · '+(60+b[k]*50)+' 元',k)).join('')+'</div><small>升级还需木料 4 + 当前等级 × 2、竹材 3；每次扩容 +2 床位。</small><div class="button-row">'+act('清扫圈舍','clean')+act('铺垫草','bedding')+act('补屋顶','repair')+'</div><details><summary>省心设施 · 自动照料</summary><p>每项初装 100 元、木料 5、竹材 4。次日结算时消耗料仓存货，空仓暂停。</p>'+[['autoFeed','自动添料'],['autoClean','自动换草'],['autoCollect','自动收集']].map(([k,n])=>act(n+' · '+(b[k]?'开':'关'),k)).join('')+'</details>';}h+='</article>';}
 h+='</div><div class="ranch-note"><h3>迎接一位新伙伴</h3><div class="farm-controls"><label>种类'+select('ranch-species',Object.entries(R.species).map(([id,v])=>[id,v.name+' · 成年 '+v.cost+' 元起']),'hen')+'</label><label>性别'+select('ranch-sex',[['female','母'],['male','公']],'female')+'</label><label>品种'+select('ranch-breed',Object.entries(R.breeds).map(([id,v])=>[id,v.name+' · 价 ×'+v.cost]),'local')+'</label><label>年龄'+select('ranch-age',[['young','幼崽 · 七折'],['adult','成年']],'young')+'</label>'+btn('前往畜舍迎接','purchase')+'</div><p>先修好对应畜舍。幼崽长大才生产；全村牧场最多 32 位，孕育中的床位也计算在内。</p></div>';
 if(s.ranch.rehomed.length)h+='<div class="ranch-note"><h3>邻村寄养记录</h3>'+s.ranch.rehomed.map(b=>'<p>'+esc(b.animal.name)+' · '+R.species[b.animal.type].name+' '+btn('接回 · '+b.fee+' 元','adopt',b.animal.id)+'</p>').join('')+'</div>';return h;
}
function breeding(s){return '<div class="ranch-note"><h3>给新生命预留一张暖床</h3><p>同种成年母畜与公畜，健康 ≥70、饱食 ≥55、心情 ≥50，干净圈舍和空余床位。母畜生产后至少休养 12 天。恶劣天气缺少暖巢、母畜不适时，孕育会等待。</p><div class="farm-controls"><label>母畜'+select('ranch-mother',s.animals.filter(a=>a.sex==='female').map(a=>[a.id,a.name+' · '+R.species[a.type].name]))+'</label><label>公畜'+select('ranch-father',s.animals.filter(a=>a.sex==='male').map(a=>[a.id,a.name+' · '+R.species[a.type].name]))+'</label>'+btn('安排配对 · 精料 2 / 20 元','breed')+'</div><p>幼崽继承亲本之一的品种；性格有自己的特点。成年时间：鸡 6 天、鸭 8 天、羊 10 天、猪 12 天、牛 14 天。</p></div><div class="ranch-note"><h3>巢箱孵化</h3><p>鸡鸭舍舒适度至少 1 级；只使用受精蛋，普通鸡蛋鸭蛋保留做饭。</p>'+btn('孵一枚鸡蛋 · 4 天','incubate','hen')+btn('孵一枚鸭蛋 · 5 天','incubate','duck')+'</div><div class="ranch-barns">'+s.ranch.births.map(b=>'<article class="ranch-barn"><h3>'+R.species[b.type].name+' · '+R.breeds[b.breed].name+'</h3><p>还需 '+b.remaining+' / '+b.total+' 个舒适日</p><div class="farm-meter"><i style="width:'+(1-b.remaining/b.total)*100+'%"></i></div><small>床位已预留 · '+(b.mother?esc(s.animals.find(a=>a.id===b.mother)?.name)+' 正在孕育':'巢箱孵化中')+'</small></article>').join('')+'</div>';}
function stores(s){return '<div class="ranch-note"><h3>料仓里的余粮</h3><p>手喂取自背包；自动食槽取自料仓。鸡鸭不吃青干草。不同动物每次 1—3 份，丰产种吃得更多。</p><div class="ranch-supply">'+Object.keys(s.ranch.stores).map(id=>'<div><b>'+D.items[id].name+'</b><span>仓 '+s.ranch.stores[id]+' · 包 '+(s.bag[id]||0)+'</span>'+btn('存 5','store',id)+btn('取 5','withdraw',id)+btn('买 5 · '+D.items[id].cost*5+' 元','buy',id,'data-qty="5"')+'</div>').join('')+'</div></div><h3>牧场手作 · 农牧相养</h3><div class="ranch-barns">'+Object.entries(R.recipes).map(([id,r])=>'<article class="ranch-barn"><span class="eyebrow">'+(['cream','yogurt'].includes(id)?'小灶排队加工 · 手动收取':r.days?'次日完成':'现场制作')+'</span><h3>'+r.name+'</h3><p>'+Object.entries(r.needs).map(([k,n])=>D.items[k].name+' ×'+n).join(' + ')+'<br>→ '+D.items[r.out].name+' ×'+r.qty+'</p>'+btn('走去工位制作','craft',id)+'</article>').join('')+'</div><div class="ranch-note"><h3>日常补给</h3>'+['animalMedicine','fertileHenEgg','fertileDuckEgg'].map(id=>btn(D.items[id].name+' · '+D.items[id].cost+' 元','buy',id)).join('')+'<p><button class="mini-btn" data-action="orders">查看牧场邻里心愿</button> 蛋与奶也能用于已有菜谱；圈肥熟化后用于四时农事，优先消耗普通品质，珍品可以留着。</p></div>';}
function pets(s){const p=s.ranch.pet;return '<div class="ranch-profile"><div class="ranch-pet-symbol">'+(s.pet.type==='cat'?'猫':'犬')+'</div><div><span class="eyebrow">小院伙伴</span><h2>'+esc(s.pet.name)+'</h2><p>亲近 '+s.pet.bond+' · 训练 '+p.training+'/100</p></div></div><div class="ranch-metrics">'+metric('饱食',p.hunger,'#b6a15f')+metric('精神',p.energy,'#72967d')+'</div><div class="ranch-note"><p>训练达到 20 且吃饱：狗在巡牧时减少走远和惊吓；猫帮助照看粮仓。每天只需练习一次。跟随沿路行走，进屋时在外等候。</p><div class="button-row">'+btn('走近添饭 · 饲料 1','pet','feed')+btn('一起练习','pet','train')+btn('陪它玩一会','pet','play')+'</div></div><div class="ranch-filter">'+[['home','回小院歇息'],['follow','沿路跟随'],['patrol','巡看牧场']].map(([id,n])=>btn(n,'pet-mode',id,p.mode===id?'aria-current="page"':'')).join('')+'</div>';}
function guide(s){return '<div class="ranch-note"><h3>不必把每一天过成清单</h3><p>基础饲料可以维持健康与稳定产出。亲近、营养料、舒适床位和清洁提高品质；普通、优质、上品、珍品与种植共用背包和价格体系。乡土种最高上品，健壮种与丰产种最高珍品。</p><p>鸡鸭每日产蛋；母牛每日产奶；羊毛约三天一剪；猪积攒圈肥、在放牧时偶尔拱到菌子。饥饿、疾病、年长会放慢节奏。幼崽和公鸡、公鸭、公牛不生产蛋奶。</p><h3>留一点草，也留一点余地</h3><p>白日放牧可补充饱食；草量会消耗，换区让另一片草甸恢复。鸭偏爱塘边。17:30 后归舍，幼崽、颐养或休养伙伴留舍；恶劣天气同样归舍。</p><h3>先预警，再照料</h3><p>连续饥饿、潮湿拥挤会逐渐带来不适。梳洗、垫草、通风排水、护理药与兽医都能改善；严重时暂停生产。动物不会死亡，走远可沿路线找回。颐养仍保留名字与亲近。</p><h3>畜舍与旧存档</h3><p>旧存档保留原有伙伴、背包和产物；旧自动牧舍投资转为床位和食槽。新自动设施需要料仓储备。存档同时记录位置、幼崽、亲本、品质与送养记录。</p></div><h3>牧场近况</h3>'+s.ranch.notices.map(n=>'<p class="ranch-log">第 '+(n.day+1)+' 天 · '+esc(n.text)+'</p>').join('');}
function render(s,A){R.ensure(s);let h='<div class="ranch-book">'+A.head('东坡 · 牧场名册','看它们慢慢长大，也把日子照料得暖一点。')+'<div class="ranch-summary">'+[['伙伴',s.animals.length],['待收产',s.animals.filter(a=>a.ready||a.feathers).length],['待留意',s.animals.filter(a=>a.hunger<40||a.illness>=20||a.lost).length],['新生命',s.ranch.births.length]].map(([n,v])=>'<div><b>'+v+'</b><span>'+n+'</span></div>').join('')+'</div><div class="ranch-policy"><label>牧场作息'+select('ranch-policy',[['safe','晴好日放牧'],['day','白日放牧（雨天也出舍）'],['inside','留舍照料']],s.ranch.policy)+'</label><label>轮牧区'+select('ranch-zone',R.zones.map((z,i)=>[String(i),z.name+' · 草量 '+Math.round(s.ranch.grass[i])]),String(s.ranch.zone))+'</label><label>默认饲料'+select('ranch-feed',Object.entries(R.feedKinds).map(([id,v])=>[id,v.name]),s.ranch.feed)+'</label>'+btn('记住照料安排','policy')+'</div><nav class="ranch-tabs">'+[['animals','伙伴'],['barns','畜舍'],['breeding','繁育'],['stores','料仓手作'],['pets','猫狗'],['guide','牧场手册']].map(([id,n])=>btn(n,'tab',id,ui.tab===id?'aria-current="page"':'')).join('')+'</nav>';
 h+=({animals:()=>animals(s),barns:()=>housing(s),breeding:()=>breeding(s),stores:()=>stores(s),pets:()=>pets(s),guide:()=>guide(s)})[ui.tab]();return h+'</div>';
}
const old={render:X.render,dispatch:X.dispatch,mount:X.mount};
X.render=(name,arg,s,A)=>name==='animals'?render(s,A):old.render(name,arg,s,A);
X.mount=s=>{old.mount(s);for(const canvas of document.querySelectorAll('[data-ranch-animal]')){const a=s.animals.find(v=>v.id===canvas.dataset.ranchAnimal);if(!a)continue;const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#e5e5ce';c.fillRect(0,0,144,108);c.fillStyle='#c7d0ad';c.beginPath();c.ellipse(72,84,48,13,0,0,7);c.fill();c.save();c.translate(72,85);c.scale(1.25,1.25);R.drawAnimal(c,a,0,0,0);c.restore();}};
X.dispatch=(act,id,data,ctx)=>{if(!act.startsWith('r-'))return old.dispatch(act,id,data,ctx);const{s,apply,open,render:refresh,save,update,toast,queueRanch}=ctx;R.ensure(s);const use=r=>{apply(r);refresh();},store=()=>{save();update();refresh();},task=t=>queueRanch([t]);
 if(act==='r-open'){ui.tab='animals';ui.filter='all';ui.selected=id;open('animals');}
 if(act==='r-tab'){ui.tab=id;ui.batch=null;refresh();}if(act==='r-filter'){ui.filter=id;ui.batch=null;refresh();}if(act==='r-select'){ui.selected=id;ui.confirm=null;refresh();}
 if(act==='r-task')task({animalId:id,action:data.op,arg:s.ranch.feed});
 if(act==='r-batch'){ui.batch=id;refresh();}if(act==='r-batch-start'){ui.batch=null;queueRanch(R.plan(s,filtered(s).map(a=>a.id),id));}
 if(act==='r-policy'){s.ranch.policy=val('ranch-policy');s.ranch.zone=Number(val('ranch-zone'));s.ranch.feed=val('ranch-feed');s.freeRange=s.ranch.policy!=='inside';store();toast('已记住，伙伴会按作息沿路活动。');}
 if(act==='r-barn')task({barnId:id,action:data.op});
 if(act==='r-purchase'){const t=val('ranch-species');task({barnId:R.species[t].home,action:'purchase',arg:[t,val('ranch-sex'),val('ranch-breed'),val('ranch-age')==='young']});}
 if(act==='r-breed'){const m=val('ranch-mother'),f=val('ranch-father'),a=s.animals.find(a=>a.id===m);if(!a||!f)toast('先迎接同种成年母畜与公畜。',true);else task({barnId:R.species[a.type].home,action:'breed',arg:[m,f]});}
 if(act==='r-incubate')task({barnId:'poultry',action:'incubate',arg:id});
 if(act==='r-store'||act==='r-withdraw')use(R.storeFeed(s,id,5,act==='r-withdraw'));
 if(act==='r-buy')use(C.buy(s,id,Number(data.qty)||1));
 if(act==='r-craft')task({barnId:'cattle',action:'craft',arg:id});
 if(act==='r-pet')task({pet:true,action:id});
 if(act==='r-pet-mode')use(R.petAction(s,id));
 if(act==='r-rename')use(R.action(s,id,'name',val('ranch-name')));
 if(act==='r-rehome'){ui.confirm=id;refresh();}if(act==='r-cancel'){ui.confirm=null;refresh();}if(act==='r-confirm'){ui.confirm=null;use(R.rehome(s,id,true));}if(act==='r-adopt')use(R.adopt(s,id));
 return true;};
})(window);

</script>
<script>
(function(root){
  'use strict';
  const K=root.ZRZKitchen,C=root.ZRZCore,D=root.ZRZData,X=root.ZRZPanels,V=root.ZRZVillage;
  const ui={tab:'recipes',filter:'全部',station:'all',heat:null,batch:1},esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const btn=(text,action,id='',extra='')=>'<button class="mini-btn" data-action="k-'+action+'" data-id="'+esc(id)+'" '+extra+'>'+text+'</button>';
  const select=(id,items,value)=>'<select id="'+id+'">'+items.map(([k,n])=>'<option value="'+esc(k)+'" '+(k===value?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
  const icon=id=>'<canvas width="48" height="48" data-item="'+id+'" aria-hidden="true"></canvas>';
  const needs=(s,map,n=1)=>'<div class="k-ingredients">'+Object.entries(map).map(([id,q])=>'<span class="'+((s.bag[id]||0)<q*n?'missing':'')+'">'+icon(id)+D.items[id].name+' <b>'+(s.bag[id]||0)+' / '+q*n+'</b></span>').join('')+'</div>';
  const batch=()=>'<label class="k-batch">批量份数 '+select('k-batch',[1,3,5,10,15,20].map(n=>[String(n),n+' 份']),String(ui.batch))+' · 卡片展示每份用料，投料前请按份数备齐。</label>';
  const duration=n=>n>=1440?(n/1440).toFixed(1).replace('.0','')+' 天':Math.ceil(n)+' 分钟';
  const source=r=>r.source==='known'?'家传手写菜谱':r.source==='experiment'?'自由试配 / 累计做 5 份料理':r.source==='market'?'配方摊':r.source.startsWith('festival')?D.festivals[Number(r.source.at(-1))]:(D.npcs.find(n=>n.id===r.source)?.name||'乡亲')+'传授';
  function recipes(s){const list=D.recipes.filter(r=>ui.filter==='全部'||ui.filter==='可制作'&&s.knownRecipes.includes(r.id)&&C.has(s,r.ingredients)||r.category===ui.filter);return batch()+'<div class="k-filter">'+['全部','可制作','日常恢复','田间便当','待客家宴','节令食品'].map(t=>btn(t,'filter',t,t===ui.filter?'aria-current="page"':'')).join('')+'</div><div class="k-grid">'+list.map(r=>{const known=s.knownRecipes.includes(r.id),sub=K.needs(s,r,true,1),fresh=Object.keys(r.ingredients).filter(K.food).map(id=>K.fresh(s,id).label),buff=K.buffFor(r.id),station=K.stationFor(r.station),grade=K.quality(s,r,r.ingredients,1);return '<article class="k-recipe"><div class="k-card-head">'+icon(r.id)+'<div><span class="eyebrow">'+r.category+' · '+r.station+'</span><h3>'+D.items[r.id].name+'</h3></div><span class="k-seal">'+(r.season===undefined?'家常':D.seasons[r.season]+'令')+'</span></div><p>'+r.story+'</p>'+needs(s,r.ingredients)+'<div class="k-meta"><span>体力 +'+D.items[r.id].energy+'</span><span>保鲜 '+K.shelf(r.id)+' 天</span><span>快做预计 '+K.grades[grade]+'</span></div><small>'+source(r)+' · 熟练 '+(s.kitchen.mastery[r.id]||0)+(buff?' · '+buff+' 180 分钟':'')+'</small><div class="button-row">'+(known?btn('快做 1 份','make',r.id,'data-qty="1"')+btn('批量 '+ui.batch+' 份','make',r.id,'data-qty="chosen"')+(!['腌菜坛','晾晒架'].includes(r.station)?btn('亲手掌火','manual',r.id):'')+(!C.has(s,r.ingredients)&&C.has(s,sub)?btn('家常替代','sub',r.id):''):btn('购配方 · 35 元','buy',r.id,(r.source==='experiment'||r.source!=='market'&&!C.market(s).open)?'disabled':''))+'</div>'+(!K.available(s,station)?'<small class="missing">需先在修缮小院添置'+r.station+'</small>':'')+'</article>';}).join('')+'</div>';}
  function workshop(s){return batch()+'<div class="k-filter">'+[['all','全部设备'],...Object.entries(K.stations).map(([id,v])=>[id,v.name])].map(([id,n])=>btn(n,'station',id,id===ui.station?'aria-current="page"':'')).join('')+'</div><div class="k-grid">'+K.processing.filter(r=>ui.station==='all'||r.stationId===ui.station).map(r=>{const eq=s.kitchen.equipment[r.stationId],base=Math.ceil(r.minutes*(1-eq.level*.15)),start=Math.max(K.now(s),...s.kitchen.jobs.filter(j=>j.station===r.stationId).map(j=>j.ready)),minutes=r.stationId==='dry'&&root.ZRZEnvironment?root.ZRZEnvironment.dryingReady(start,base,eq.level)-start:base;return '<article class="k-recipe"><div class="k-card-head">'+icon(r.out)+'<div><span class="eyebrow">'+K.stations[r.stationId].name+'</span><h3>'+r.name+'</h3></div></div>'+needs(s,r.needs)+'<p>每份产出 '+D.items[r.out].name+' ×'+r.qty+'<br>'+duration(minutes)+' / 组 · '+(K.food(r.out)?'保鲜 '+K.shelf(r.out)+' 天':'可长期储存')+'</p><div class="k-meta"><span>容量 '+K.capacity(s,r.stationId)+' 份 / 组</span><span>队列 '+s.kitchen.jobs.filter(j=>j.station===r.stationId).length+' / '+(2+eq.level)+'</span><span>预计 '+K.grades[K.quality(s,r,r.needs,1)]+'</span></div><div class="button-row">'+btn('投料 1 批','process',r.id,'data-qty="1"')+btn('批量投料 '+ui.batch+' 份','process',r.id,'data-qty="chosen"')+'</div>'+(!K.available(s,r.stationId)?'<small class="missing">先修缮 '+(K.stations[r.stationId].upgrade==='kitchen'?'厨房':K.stations[r.stationId].station)+'</small>':'')+'</article>';}).join('')+'</div>';}
  function jobs(s){return '<div class="k-note">同一台设备按投料顺序加工，不同设备同时开工。成品留在设备内，收取后才开始计算保鲜；晾晒投料时已按跨日预报计算完成时间：晴日加快、阴雨减慢，之后不会每天追加等待。二级遮雨烘干不受天气影响；旧队列保留原完成时刻。</div><div class="k-grid">'+(s.kitchen.jobs.length?s.kitchen.jobs.map(j=>{const ready=j.ready<=K.now(s),progress=Math.max(0,Math.min(100,(K.now(s)-j.start)/(j.ready-j.start)*100));return '<article class="k-recipe"><div class="k-card-head">'+icon(j.id)+'<div><span class="eyebrow">'+K.stations[j.station].name+'</span><h3>'+D.items[j.id].name+' ×'+j.qty+'</h3></div></div><p>'+(ready?'已完成 · 等你装进竹篮':j.start>K.now(s)?'排队等待 · '+duration(j.start-K.now(s))+' 后开工':'正在加工 · 还需 '+duration(j.ready-K.now(s)))+'</p><div class="k-progress"><i style="width:'+progress+'%"></i></div><p>'+K.grades[j.grade]+(j.station==='dry'?' · 完成时刻已计入投料时的天气与设备':'')+(j.weatherDelay?' · 旧队列已顺延 '+j.weatherDelay+' 天':'')+'</p>'+btn('走去收取','collect',j.key,ready?'':'disabled')+'</article>';}).join(''):'<div class="k-note">灶间还没有加工中的食物。到「乡间工序」投一批料吧。</div>')+'</div>'+(s.processing.length?'<div class="k-note"><h3>旧工序接续</h3>'+s.processing.map(j=>'<p>'+D.items[j.id].name+' ×'+j.qty+' · '+(j.readyDay-s.day)+' 天后自动收好</p>').join('')+'升级前的加工照常完成，不会丢失原料。</div>':'');}
  function pantry(s){return '<div class="k-note"><b>先用旧食材，慢慢存新收成。</b><p>新鲜 → 尚可 → 宜先用 → 陈放。陈放不会消失，售价最低为七成、食用回复最低约六成五，成菜最高优质。背包每日按 1 个标准保鲜日陈放；暑热乘 1.25、严寒乘 0.75。普通储物柜半速，阴凉食橱始终四分之一速度，不受冷热变化影响。相同物品保留各批年龄。</p><p>料理增益持续 180 游戏分钟：饱足 / 暖胃使劳动少耗 1 点体力；轻快使步行速度 +12%。新增益替换旧增益。</p>'+btn(s.kitchen.cold?'阴凉食橱已备好':'添阴凉食橱 · 150 元 / 竹材 6','cold','',s.kitchen.cold?'disabled':'')+'</div><div class="k-pantry">'+['bag','storage'].flatMap(side=>Object.entries(s[side]).filter(([id,n])=>n>0&&K.food(id)).sort(([a],[b])=>K.fresh(s,a,side).ratio-K.fresh(s,b,side).ratio).map(([id,n])=>{const f=K.fresh(s,id,side);return '<article class="k-food">'+icon(id)+'<div><b>'+D.items[id].name+' ×'+n+'</b><small>'+(side==='bag'?'背包':'储物柜')+' · '+K.category(id)+' · '+f.label+' · 余 '+f.days+' 保鲜日</small><div class="k-progress"><i style="width:'+f.ratio*100+'%"></i></div></div><div>'+btn(side==='bag'?'存 1 份':'取 1 份','store',id,'data-side="'+side+'"')+(side==='bag'&&D.items[id].energy?btn('尝一口','eat',id):'')+'</div></article>';})).join('')+'</div>';}
  function research(s){const foods=Object.entries(s.bag).filter(([id,n])=>n>0&&K.food(id)&&D.items[id].kind!=='料理').map(([id,n])=>[id,D.items[id].name+' · '+K.category(id)+' ×'+n]);return '<div class="k-research"><div class="k-research-art"><span>食</span><b>把时令放进一碗汤</b><p>谷香 · 清香 · 鲜香 · 奶香 · 甘甜</p></div><div><h3>先闻一闻，再试一个搭配</h3><p>匹配已有菜谱：领会做法、保留食材。新的搭配：各用一份，煮成能吃的田园汤并记入手札。重复选同一食材需两份。</p><label>主料'+select('k-first',foods)+'</label><label>配料'+select('k-second',foods)+'</label><p id="k-flavor-preview">选择两种食材，看看它们的风味。</p>'+btn('走到灶前试配','experiment')+'<p>季节线索：春荠菜＋竹笋，夏山果＋茶叶；累计做 5 份料理领会全部四季新菜。灶台 2 级可跨季制作。</p></div></div><h3>搭配手札</h3><div class="k-grid">'+s.kitchen.experiments.map(signature=>'<article class="k-note">'+signature.split('+').map(id=>D.items[id].name).join(' ＋ ')+' → 田园汤 '+btn('再做这一碗','repeat',signature)+'</article>').join('')+'</div>';}
  function tools(s){return '<div class="k-note">升级提升容量、队列和速度，清洁改善品质；设备不会永久损坏。已有厨房、庭院、石磨修缮仍是基础解锁条件。'+btn('打开修缮小院','upgrades')+'</div><div class="k-grid">'+Object.entries(K.stations).map(([id,st])=>{const e=s.kitchen.equipment[id],available=K.available(s,id);return '<article class="k-recipe"><span class="eyebrow">'+(available?'可使用':'尚未添置')+'</span><h3>'+st.name+' · '+e.level+' 级</h3><p>洁净 '+e.clean+' / 100 · '+K.capacity(s,id)+' 份 / 组 · '+(2+e.level)+' 队列槽<br>新工序耗时 −'+e.level*15+'%'+(id==='dry'&&e.level===2?' · 遮雨烘干':'')+'</p><div class="k-progress"><i style="width:'+e.clean+'%"></i></div><p>'+ (e.level<2?'升级需 '+(90+e.level*110)+' 元 / 木料 '+(6+e.level*4)+' / 竹材 4':'已经是最顺手的工位')+'</p>'+btn('走去擦洗','clean',id,available?'':'disabled')+btn('改良工位','upgrade',id,available&&e.level<2?'':'disabled')+'</article>';}).join('')+'</div>';}
  function heat(s,arg){ui.heat={...arg,started:performance.now()};return '<div class="k-heat"><span class="eyebrow">柴火噼啪 · '+D.items[arg.id].name+'</span><h2 id="modal-title">听见锅里滋啦一声</h2><div class="k-pot"><i></i><i></i><i></i><span>♨</span></div><p>把指针留在绿色区域，按「起锅」。区域宽，错过也会做成可口家常饭。</p><div class="k-fire"><div class="k-good"></div><i id="k-needle"></i></div><p id="k-heat-reading" aria-live="off">温锅中</p><div class="button-row">'+btn('起锅','finish')+btn('省心火候 · 稳定快做','assist')+'</div><small>随时关闭不扣食材。移动端也可一键省心制作。</small></div>';}

function inventory(s){const ids=itemIds(s),pages=pager(ids);return '<div class="ec-note">同类自动堆叠，品质和新鲜度分开保留。继续沿用宽松容量，不会因收成多而丢弃物品。锁定保护适用于出售、食用、赠送和制作；存取仍可用。</div><div class="ec-pins"><b>常用篮</b>'+s.economy.pinned.map(id=>btn(D.items[id].name+' ×'+(s.bag[id]||0),'item',id)).join('')+(s.economy.pinned.length?'':'<small>选物品加入，最多六样，耗尽也不换位。</small>')+'</div><div class="ec-toolbar">'+btn('随身物品','side','bag',ui.side==='bag'?'aria-current="page"':'')+btn('储物柜','side','storage',ui.side==='storage'?'aria-current="page"':'')+btn(ui.side==='bag'?'本类存余量 · 留 5 份':'本类补给 · 补到 5 份','tidy')+'<button class="mini-btn" data-action="processing">食橱保鲜</button></div>'+filterbar()+pages+'<div class="ec-inventory"><div class="ec-grid">'+(ids.slice(ui.page*18,ui.page*18+18).map(id=>'<button class="ec-tile '+(id===ui.id?'selected':'')+'" data-action="ec-item" data-id="'+id+'">'+icon(id)+'<strong>'+D.items[id].name+'</strong><span>×'+s[ui.side][id]+' '+(E.locked(s,id)?'· 已锁':'')+'</span><small>'+E.category(id)+(K.food(id)?' · '+K.fresh(s,id,ui.side).label:'')+'</small></button>').join('')||'<p>这个分类暂时没有物品。</p>')+'</div>'+detail(s)+'</div>'+(s.upgrades.storage?'<p class="ec-note">柜子与背包分开。食材存柜减缓陈放，阴凉食橱与粮仓保鲜改良继续生效；制作使用随身材料。</p>':'<p class="ec-note">储物柜尚未修好，可在营造簿添置。<button class="mini-btn" data-action="build">去修缮</button></p>');}
function shop(s){const sold=E.daily(s),ids=itemIds(s,true),pages=pager(ids);return '<div class="ec-note">基础种子、饲料与常用原料长期有货。今日货签每种最多 5 份，刷新不用蹲点。所有商品按普通品质、新鲜状态购入；购价与收购价分开。</div><h3>许婶今日货签</h3><div class="ec-special">'+E.offers(s).map(id=>{const price=Math.max(Math.ceil(D.items[id].price*1.85),Math.floor(E.shopPrice(id)*.9));return '<article>'+icon(id)+'<b>'+D.items[id].name+'</b><span>'+price+' 元 · 余 '+(5-(sold[id]||0))+' 份</span>'+btn('走去买一份','buy',id,'data-special="true" '+((sold[id]||0)>=5?'disabled':''))+'</article>';}).join('')+'</div>'+filterbar()+'<div class="ec-form"><label>货架购买数量<input id="ec-buy-qty" type="number" min="1" max="99" value="'+Math.min(99,ui.qty)+'"></label></div>'+pages+'<div class="ec-shop">'+ids.slice(ui.page*18,ui.page*18+18).map(id=>'<article>'+icon(id)+'<div><h3>'+D.items[id].name+'</h3><small>'+E.category(id)+' · 随身 '+(s.bag[id]||0)+' 份</small><p>'+E.shopPrice(id)+' 元 / 份</p></div>'+btn('按量购买','buy',id)+'</article>').join('')+'</div>';}
function trade(s){const id=ui.id,q=E.quote(s,id,ui.qty,ui.grade),coop=E.quote(s,id,ui.qty,ui.grade,'coop'),stall=E.quote(s,id,ui.qty,ui.grade,'stall',ui.theme),can=q.available&&!E.locked(s,id);return '<div class="ec-note">柜台现售即刻结算；主题摊位需要亲手摆放、等待客人；合作社接受大批量并锁定交货价，隔日回来领钱。你可以先在这里规划，再沿村道前往。</div><div class="ec-form"><label>本批物品'+select('ec-trade-item',Object.keys(s.bag).filter(id=>s.bag[id]>0).map(id=>[id,D.items[id].name+' ×'+s.bag[id]]),id)+'</label><label>数量<input id="ec-qty" type="number" min="1" max="999999" value="'+ui.qty+'"></label><label>品质'+select('ec-grade',grades(),ui.grade)+'</label><label>摊位主题'+select('ec-theme',Object.entries(E.themes),ui.theme)+'</label>'+btn('更新交易预览','trade-preview')+'</div><section class="ec-price"><div class="ec-item-head">'+icon(id)+'<div><small>当前货签</small><h3>'+D.items[id].name+' ×'+ui.qty+'</h3><span>'+quality(s,id)+'</span></div></div><p>'+q.reasons.join(' · ')+'</p><small>品质折合 ×'+q.quality.toFixed(2)+(q.fresh?' · 新鲜度 '+Math.round(q.fresh.ratio*100)+'%':'')+' · '+(can?'可以交易':E.locked(s,id)?'已锁定，先去背包解除':'所选数量或品质不足')+'</small></section><div class="ec-channels">'+[['instant','许婶柜台',q.money,'立即交货结算，有回购货签'],['stall',E.themes[ui.theme],stall.money,(E.match(id,ui.theme)?'契合主题 +12%':'普通陈列 +4%')+'；3 体力，等待 90 分钟，最多 12 份'],['coop','禾溪合作社',coop.money,'锁价 +8%；明早起领取，最多 99 份']].map(([channel,name,money,text])=>'<article><small>'+name+'</small><strong>'+money+'<em> 元</em></strong><p>'+text+'</p>'+btn(channel==='instant'?'走去卖出':'走去交货',channel==='instant'?'sell':'send',channel,can&&(channel==='instant'||ui.qty<=(channel==='stall'?12:99))?'':'disabled')+'</article>').join('')+'</div><div class="ec-cart"><h3>售货篮 · '+ui.cart.length+' 条</h3>'+btn('把本批放进篮里','cart-add','',can?'':'disabled')+btn('清空售货篮','cart-clear')+ui.cart.map((l,i)=>'<p>'+D.items[l.id].name+' ×'+l.n+' / '+(l.grade<0?'普通优先':K.grades[l.grade])+' '+btn('移出','cart-remove',i)+'</p>').join('')+btn('走去整篮出售','batch','',ui.cart.length?'':'disabled')+'<p>整篮到达柜台后重新核对，任一货签不足或已锁定就整篮取消，不扣料。</p></div><h3>短期回购 · 最近 30 笔</h3><div class="ec-receipts">'+(s.economy.receipts.filter(r=>s.day-r.day<=2).map(r=>'<article><div><b>'+D.items[r.id].name+' ×'+r.qty+'</b><p>原货品质保留 · 还能跨 '+(2-s.day+r.day)+' 次睡醒回购 · 原收入 '+r.price+' 元</p></div>'+btn('回购 · '+(r.price+Math.max(1,Math.ceil(r.price*.05)))+' 元','buyback',r.key)+'</article>').join('')||'<p>现售后会留下货签；原收入加 5% 保管费，至少 1 元。回购不重置食材年龄。</p>')+'</div>';}
function business(s){const jobs=s.economy.jobs;return '<div class="ec-note">供货信用 '+s.economy.rep+' · '+(s.economy.rep>=20?'可同时处理 8 张货单':'信用满 20 后，货单上限从 4 张增到 8 张')+'。普通品质也能完成时令与早餐订单。每周换新，无失约罚款；已交的货单不会过期。</div><h3>在途与待领货单 · '+jobs.length+'</h3><div class="ec-receipts">'+(jobs.map(j=>'<article><div><b>'+D.items[j.id].name+' ×'+j.qty+' · '+(j.channel==='coop'?'合作社':E.themes[j.theme])+'</b><p>货款 '+j.price+' 元 · '+(K.now(s)>=j.ready?'可以领取':'还有 '+Math.ceil(j.ready-K.now(s))+' 游戏分钟')+'</p></div><div>'+btn('走去领款','collect',j.key,K.now(s)>=j.ready?'':'disabled')+btn('走去撤回原货','cancel',j.key)+'</div></article>').join('')||'<p>尚无在途货单，可在买卖页比较三个渠道。</p>')+'</div><h3>合作社本周需求</h3><div class="ec-orders">'+E.orders(s).map(o=>{const done=s.economy.claimed.includes(o.key),n=E.counts(s,o.id).slice(o.grade).reduce((a,b)=>a+b,0);return '<article><small>信用 +3 · 每周一次</small><h3>'+o.title+'</h3><div class="ec-item-head">'+icon(o.id)+'<b>'+D.items[o.id].name+' ×'+o.qty+'</b></div><p>'+K.grades[o.grade]+'及以上 · 可用 '+n+' 份<br>按品质基础价 +15%，另加 '+o.bonus+' 元；不受时价影响。</p>'+btn(done?'本周已交':'走去交订单','order',o.key,done||n<o.qty||E.locked(s,o.id)?'disabled':'')+'</article>';}).join('')+'</div><h3>交易流水 · 最近 80 笔</h3><div class="ec-ledger">'+(s.economy.ledger.map(l=>'<div><span>第 '+(l.day+1)+' 天 · '+l.kind+' · '+D.items[l.id].name+' ×'+l.qty+'</span><b class="'+(l.money>0?'income':'')+'">'+(l.money>0?'+':'')+l.money+' 元</b></div>').join('')||'<p>从第一笔买卖开始记账。这里只记录物品交易。</p>')+'</div>';}
const old={render:X.render,after:X.after,dispatch:X.dispatch};X.panels.push('economy');
X.render=(name,arg,s,A)=>{if(!['economy','bag','sell','shop','storage'].includes(name))return old.render(name,arg,s,A);E.ensure(s);if(ui.lastName!==name){ui.lastName=name;ui.tab=name==='shop'?'shop':name==='sell'?'trade':name==='economy'?'business':'inventory';if(name==='storage')ui.side='storage';else if(name==='bag')ui.side='bag';if(!s[ui.side][ui.id]){ui.id=Object.keys(s[ui.side]).find(id=>s[ui.side][id]>0)||ui.id;ui.qty=1;ui.grade=-1;}ui.page=0;}if(!D.items[ui.id])ui.id=Object.keys(s.bag)[0]||'cabbage';return '<div class="ec-book"><header class="ec-hero"><div><small>禾溪物产 · 一篮一账</small>'+A.head('收成有去处，日子有余量。','留一份给灶火，藏一份过时令，余下的交给老街。')+'</div><div class="ec-stamp">物<br>产</div></header><div class="ec-summary"><span>随身 <b>'+Object.values(s.bag).reduce((a,b)=>a+b,0)+' 份</b></span><span>零钱 <b>'+s.money+' 元</b></span><span>待领 <b>'+s.economy.jobs.filter(j=>j.ready<=K.now(s)).length+' 单</b></span></div><nav class="ec-tabs">'+[['inventory','物品与储藏'],['shop','杂货货架'],['trade','买卖与回购'],['business','合作与账本']].map(([id,n])=>btn(n,'tab',id,ui.tab===id?'aria-current="page"':'')).join('')+'</nav>'+({inventory,shop,trade,business}[ui.tab])(s)+'</div>';};
X.after=(name,s,A)=>['bag','sell','shop','storage','economy'].includes(name)?'':old.after(name,s,A)+(name==='menu'?'<div class="button-row"><button class="secondary" data-action="economy">物产与经营 · 合作社、摆摊和账本</button></div>':'');
X.dispatch=(action,id,data,ctx)=>{if(!action.startsWith('ec-'))return old.dispatch(action,id,data,ctx);const{s,render:refresh,apply,queueBuild,equipSeed,close,toast}=ctx,op=action.slice(3),value=id=>document.getElementById(id)?.value,use=r=>{apply(r);refresh();},amount=()=>{ui.qty=Math.max(1,Math.min(999999,Math.floor(Number(value('ec-qty')))||1));ui.grade=Number(value('ec-grade'));};E.ensure(s);
if(op==='tab'){ui.tab=id;ui.page=0;refresh();}if(op==='side'){ui.side=id;ui.page=0;refresh();}if(op==='filter'){ui.search=value('ec-search').trim();ui.filter=value('ec-category');ui.sort=value('ec-sort');ui.page=0;refresh();}if(op==='page'){ui.page=Math.max(0,ui.page+Number(id));refresh();}if(op==='item'){ui.id=id;ui.qty=1;ui.grade=-1;refresh();}if(op==='amount'){amount();refresh();}if(op==='lock')use(E.lock(s,id));if(op==='pin')use(E.pin(s,id));if(op==='transfer')use(E.transfer(s,id,ui.qty,ui.side==='bag',ui.grade));if(op==='tidy')use(E.tidy(s,ui.filter,ui.side==='bag'));if(op==='eat')use(C.eat(s,id));if(op==='seed'){const crop=Object.keys(D.crops).find(c=>Object.keys(F.kinds).some(k=>F.seedId(c,k)===id));if(crop){s.seed=crop;s.farm.seedKind=Object.keys(F.kinds).find(k=>F.seedId(crop,k)===id);equipSeed();apply({ok:true,msg:'拿好这袋种子了。'});close();}}
if(op==='trade'){ui.id=id;ui.side='bag';ui.tab='trade';refresh();}if(op==='trade-preview'){amount();ui.id=value('ec-trade-item')||ui.id;ui.theme=value('ec-theme');refresh();}if(op==='buy')queueBuild({op:'economy-buy',id,n:data.special?1:Number(value('ec-buy-qty')),special:!!data.special});if(op==='sell')queueBuild({op:'economy-sell',id:ui.id,n:ui.qty,grade:ui.grade});if(op==='send')queueBuild({op:'economy-send',id:ui.id,n:ui.qty,grade:ui.grade,channel:id,theme:ui.theme});if(op==='buyback')queueBuild({op:'economy-buyback',key:Number(id)});if(op==='collect'||op==='cancel')queueBuild({op:'economy-collect',key:Number(id),cancel:op==='cancel'});if(op==='order')queueBuild({op:'economy-order',id});
if(op==='cart-add'){if(ui.cart.length>=12)toast('售货篮最多十二条，先交这一篮。',true);else ui.cart.push({id:ui.id,n:ui.qty,grade:ui.grade});refresh();}if(op==='cart-clear'){ui.cart=[];refresh();}if(op==='cart-remove'){ui.cart.splice(Number(id),1);refresh();}if(op==='batch')queueBuild({op:'economy-batch',lines:ui.cart.map(v=>({...v}))});return true;};
})(typeof window!=='undefined'?window:globalThis);

<script>
(function(root){
'use strict';const S=root.ZRZScenes,V=root.ZRZVillage,D=root.ZRZData,C=root.ZRZCore,X=root.ZRZPanels;
const ui={search:'',region:'all',selected:null,route:null},labels={all:'全村',homes:'乡亲住处',neighbors:'乡亲此刻',services:'屋舍与地标',harvest:'成熟田块',water:'待补水',animals:'牧场伙伴',resources:'今日采集',pins:'我的标记'},colors={homes:'#ac6851',neighbors:'#ad6597',services:'#38786f',harvest:'#c68b2b',water:'#408fad',animals:'#8b744c',resources:'#627b49',pins:'#a15f87'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),button=(n,op,id='',extra='')=>'<button class="mini-btn" data-action="sc-'+op+'" data-id="'+esc(id)+'" '+extra+'>'+n+'</button>';
S.pick=(s,p)=>{ui.selected=p;ui.route=S.preview(s,p);};
function drawMap(c,s,{mini=false,path=null,selected=null,view=null}={}){const w=c.canvas.width,h=c.canvas.height,kx=w/V.WIDTH,ky=h/V.HEIGHT,layer=S.ensure(s).layer;
c.clearRect(0,0,w,h);c.fillStyle='#ede5c9';c.fillRect(0,0,w,h);c.save();c.scale(kx,ky);

c.restore();
if(!mini){c.font='bold 14px "Microsoft YaHei"';for(const r of V.regions){c.fillStyle='#f8efce';c.fillRect((r.x+60)*kx,(r.y+45)*ky,112,25);c.fillStyle='#334e42';c.fillText(r.name+(s.atlas.visited.includes(r.id)?'':' · 未访'),(r.x+75)*kx,(r.y+45)*ky+17);}}

  function projectCard(){return '<div class="row-card"><div class="row-text"><h3>一起修缮村口河埠 '+(s.flags.bridge?'<span class="tag">已经完成</span>':'')+'</h3><p>换下旧木板，添一张长椅。让老人孩子都能安心在河边歇脚。</p>'+(!s.flags.firstDish?'<p>先给林阿婆送一道家常菜，她会把你介绍给大家。</p>':'')+ingredients({wood:8,bamboo:6})+'</div>'+button(s.flags.bridge?'去河边看看':'和乡亲们动工',s.flags.bridge?'travel':'repair',s.flags.bridge?'river':'','mini-btn',!s.flags.bridge&&(!s.flags.firstDish||!C.has(s,{wood:8,bamboo:6}))?'disabled':'')+'</div>';}
  function startGame(){const name=$('new-name')?.value||s.name,gender=$('new-gender')?.value||'不设定';s.name=name.trim().slice(0,12)||'小满';s.gender=gender;s.flags.introDone=true;currentPanel=null;$('modal-overlay').hidden=true;$('game-root').classList.remove('menu-open');save();update();camera.update(s,0,true);$('world').focus();sound('soft');toast('欢迎回家，'+s.name+'。先用双手收下菜地左上角的青菜吧。');}
  function announceScene(){const el=$('scene-arrival');clearTimeout(arrivalTimer);el.hidden=true;void el.offsetWidth;el.innerHTML=D.scenes[s.scene].name+'<small>'+D.scenes[s.scene].subtitle+'</small>';el.hidden=false;arrivalTimer=setTimeout(()=>el.hidden=true,2700);}
  function navigate(point){if(!point)return;closePanel();keys.clear();hovered=null;pointer=null;if(s.village.interior){queuedDestination=point;walkTo(V.points(s).find(p=>p.kind==='exit'));toast('先走出小屋，再沿村道出发。');return;}walkTo(point);toast('沿村道前往：'+point.name+'。方向键可随时取消导航。');}
  function queueNeighbor(id,op,data={}){const n=D.npcs.find(n=>n.id===id),point=n&&V.npcPoint(s,n);if(!point||!window.ZRZNpc.near(s,id)){navigate(V.destination(s,'npc',id));toast('先沿路找到对方，再选择话题或一起做事。');return;}closePanel();interact({...point,kind:'npc-task',npcId:id,op,...data});}
  function travel(id){if(inputLocked)return;navigate(V.destination(s,'region',id));}
  function walkTo(point){if(!point)return;const stand=Actions.approach(s,point);path=W.route(s,stand.x,stand.y);pending=path.length?point:null;if(!path.length)toast('这条路暂时走不过去，试试旁边的空地。',true);}
  function goToPoint(scene,kind,id){let p=V.destination(s,kind,id||scene);if(!p&&kind==='cook')p=V.houses.find(h=>h.name==='禾溪小灶');if(p?.door)p=V.destination(s,'house',p.id);navigate(p);}
  function guide(){
    if(!s.flags.firstHarvest){setTool('hand');const i=s.plots.findIndex(p=>p.crop&&p.growth>=D.crops[p.crop].days);if(i>=0)navigate({kind:'plot',index:i,...W.plotPosition(i),name:'成熟的菜地'});else toast('这一轮作物还在长。选水壶照料，明早再来看看。');}
    else if(!s.flags.firstCook)goToPoint('farm','cook');
    else if(!s.flags.firstDish)openPanel('orders');
    else if(!s.flags.bridge){if(C.has(s,{wood:8,bamboo:6}))goToPoint('river','project');else{const needed=(s.bag.wood||0)<8?'wood':'bamboo',point=W.points({...s,village:{...s.village,interior:null}},true).find(p=>p.kind==='gather'&&p.item===needed&&(window.ZRZForage?window.ZRZForage.status(s,p).ready:s.collected[p.id]!==s.day));if(point)navigate(point);else toast('这一处今天已经采过了。野山也有木料，或者明天再来。');}}
    else openPanel('stories');
  }

  let lastDialogue='';
  function interact(p,performed=false){
    if(!p||currentPanel||inputLocked)return;
    if(p.kind==='npc-task'){if(!window.ZRZNpc.near(s,p.id)){toast('对方走开了，先靠近再聊。');return;}if(!performed){const n=window.ZRZNpc.profiles[p.id],kind=p.op==='join'?n.helpKind:p.op==='supply'?'trade':p.op==='story'?'read':'greet';startAction({...Actions.spec(kind,p.op==='join'?n.helpAction:p.op==='supply'?'点好材料，交到邻居手中':'停下脚步，面对面回应'),duration:p.op==='join'?2.8:1.15,item:p.op==='supply'?n.item:null},p,()=>interact(p,true));return;}const r=p.op==='talk'?window.ZRZNpc.converse(s,p.id,p.topic||'auto'):p.op==='story'?C.storyChoice(s,p.id,p.choice):window.ZRZNpc.resolve(s,p.id,p.op,p.day);if(r.ok)lastDialogue=r.msg;apply(r);openPanel(p.op==='story'?'story':'npc',p.id);return;}
    if(!performed&&p.kind==='fish'&&window.ZRZFishing){const begun=window.ZRZFishing.begin(s,p);if(!begun.ok){toast(begun.msg,true);return;}startAction(begun.spec,p,()=>apply(window.ZRZFishing.finish(s)),()=>window.ZRZFishing.cancel(s));return;}
    if(!performed){const spec=Actions.point(p,tool);if(spec){startAction(spec,p,()=>interact(p,true));return;}}
    if(p.kind==='build-task'){const r=B.perform(s,p);if(r.ok)V.feedback(s,p,p.op?.startsWith('economy-')?'harvest':'hoe',r.msg,1.7);apply(r);return;}
    if(p.kind==='build-piece'){if(p.service==='water'){const r=F.fillWater(s);V.feedback(s,p,'water',r.msg,1.5);apply(r);}else if(p.service==='rest'){V.feedback(s,p,'steam','在自己的小院里歇一歇。',1.5);apply(C.rest(s));}else if(p.service)openPanel(p.service);else{V.feedback(s,p,'spark','这处小景，是你亲手安置的。',1.5);sound('soft');}return;}
    if(p.kind==='kitchen-station'){if(['stove','steam'].includes(p.station))openPanel('cook',{tab:'recipes'});else openPanel('processing',{station:p.station});return;}

    if(path.length&&!dx&&!dy){const n=path[0],dist=Math.hypot(n.x-s.player.x,n.y-s.player.y);if(dist<=speed){s.player.x=n.x;s.player.y=n.y;path.shift();if(!path.length&&pending){const p=pending;pending=null;interact(p);}return true;}dx=(n.x-s.player.x)/dist;dy=(n.y-s.player.y)/dist;}
    const norm=Math.hypot(dx,dy);if(!norm)return false;dx=dx/norm*speed;dy=dy/norm*speed;const p=s.player;
    if(Math.abs(dx)>Math.abs(dy))p.direction=dx>0?'right':'left';else p.direction=dy>0?'down':'up';
    if(!W.blocked(s,p.x+dx,p.y))p.x+=dx;if(!W.blocked(s,p.x,p.y+dy))p.y+=dy;return true;
  }
  function frame(now){diagnostics.frames++;pollGamepad(now);const dt=Math.min(.05,(now-(lastTime||now))/1000);lastTime=now;frameTime=now/1000;
    if(!currentPanel&&!document.hidden&&V.update(s,dt)){diagnostics.sceneChanges++;update();}
    if(!currentPanel&&!document.hidden&&!inputLocked){walking=move(dt);s.minutes=Math.min(1320,s.minutes+dt*(s.settings.speed==='normal'?1.55:1.04));tick+=dt;if(tick>1){tick=0;update();if(s.minutes>=1320)openPanel('sleep');}ambient(frameTime);}else walking=false;
    window.ZRZFishing?.tick(s,dt,document.hidden);sequence.tick(dt,document.hidden);sceneFade=Math.max(0,sceneFade-dt);
    camera.update(s,dt);
    if(pointer&&!currentPanel){const point=camera.toWorld(pointer.x,pointer.y);hovered=W.hit(s,point.x,point.y);hoverInfo();positionHover();}
    const renderStart=performance.now();V.stateRuntime(s).sequence=sequence.snapshot();T.equipped=tool;W.draw(camera.buffer,s,frameTime,hovered,walking,effect,camera.view);

    if(path.length){const c=camera.buffer.getContext('2d');c.save();c.translate(-camera.view.x,-camera.view.y);c.fillStyle='#fff3b8a0';path.forEach((p,i)=>{if(i%2===0)c.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,2,2);});const dest=path[path.length-1],radius=7+Math.sin(frameTime*5)*2;c.strokeStyle='#fff0ab';c.lineWidth=1.5;c.beginPath();c.ellipse(dest.x,dest.y,radius,radius*.5,0,0,Math.PI*2);c.stroke();c.restore();}
    camera.paint();W.drawLabels?.($('world'),s,camera.view);diagnostics.renderMs=Math.round((performance.now()-renderStart)*100)/100;diagnostics.averageRenderMs=Math.round(((diagnostics.averageRenderMs||diagnostics.renderMs)*.95+diagnostics.renderMs*.05)*100)/100;
    drawJourney(dt);
    const near=!currentPanel&&!inputLocked?nearest():null;$('interaction-prompt').hidden=!near;if(near){let label=near.name;if(near.kind==='plot'){const p=s.plots[near.index];label=p.crop&&p.growth>=D.crops[p.crop].days?'成熟了 · 用双手收获':tools.find(v=>v.id===tool).desc+' · '+(p.crop?D.crops[p.crop].name:'菜地');}const point=camera.toScreen(s.player.x,s.player.y-43);$('interaction-prompt').style.left=Math.max(110,Math.min(camera.view.width-110,point.x))+'px';$('interaction-prompt').style.top=Math.max(60,Math.min(camera.view.height-145,point.y))+'px';$('interaction-prompt').innerHTML='<kbd>'+keyLabel('interact')+'</kbd>'+escape(label);}
    updateContext(near);
    requestAnimationFrame(frame);
  }
  const contextual=document.createElement('div');contextual.id='context-actions';document.getElementById('game-hud').appendChild(contextual);let contextKey='';
  function updateContext(near){const key=(currentPanel?'menu':near?.kind+'/'+(near?.id??near?.index))+'/'+s.village.riding+'/'+!!path.length;if(key!==contextKey){contextKey=key;contextual.hidden=!!currentPanel;let html='';if(near?.kind==='plot')html=button('查看这块田','f-inspect',String(near.index),'context-btn')+button('四时农事','farmcare','','context-btn');else if(near?.kind==='animal')html=button('看看这位伙伴','r-open',near.id,'context-btn')+button('喂一份','r-task',near.id,'context-btn','data-op="feed"')+button('摸摸它','r-task',near.id,'context-btn','data-op="pet"');else if(near?.kind==='fish')html=button('鱼饵与垂钓手记','fishing','','context-btn');else if(near?.kind==='gather')html=button('采法与山野手记','forage','','context-btn');else if(near?.kind==='npc')html=button('继续聊聊','v-npc-talk',near.id,'context-btn')+button('送份心意','v-npc-gift',near.id,'context-btn')+button('去他家看看','v-walk-house',V.homeOf(near.id).id,'context-btn');else if(!s.village.interior)html=button(s.village.riding?'下车慢慢走':'骑自行车','v-bike','','context-btn');if(path.length)html+='<span id="walk-progress"></span>'+button('停止带路','v-stop','','context-btn');contextual.innerHTML=html;}
    if(path.length){let dist=0,last=s.player;for(const p of path){dist+=Math.hypot(p.x-last.x,p.y-last.y);last=p;}const el=$('walk-progress');if(el)el.textContent=(queuedDestination?'先出门':pending?.name||'前往标记')+' · 约 '+Math.max(1,Math.ceil(dist/(s.village.riding?355:195)))+' 秒';}
  }
  const journey=document.createElement('div');journey.id='journey-hud';journey.innerHTML='<button id="mini-toggle" data-action="map" aria-label="打开行路地图"><canvas id="mini-map" width="264" height="106"></canvas><span id="mini-title"></span></button><div id="route-compass" hidden></div>';document.getElementById('game-hud').appendChild(journey);
  const actionHud=document.createElement('div');actionHud.id='action-progress';actionHud.hidden=true;actionHud.innerHTML='<span id="action-label"></span><div id="action-meter" role="progressbar" aria-label="动作进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="action-fill"></i></div><small id="action-phase"></small><button id="action-cancel" aria-label="取消当前动作">停下 · Esc</button>';document.getElementById('game-root').appendChild(actionHud);
  const fade=document.createElement('div');fade.id='door-fade';fade.hidden=true;document.getElementById('game-root').appendChild(fade);
  $('action-cancel').addEventListener('click',cancelAction);
  function drawJourney(dt){const a=sequence.snapshot();actionHud.hidden=!a;if(a){$('action-label').textContent=a.label;$('action-fill').style.width=(a.progress*100)+'%';$('action-meter').setAttribute('aria-valuenow',Math.round(a.progress*100));$('action-phase').textContent=a.phase+' · 完成后结算';}
    const darkness=a?.door?Math.max(0,(a.progress-.6)/.4)*.7:a?.kind==='sleep'?Math.sin(a.progress*Math.PI)*.6:sceneFade/ .3*.7;fade.hidden=!darkness;fade.style.opacity=darkness||0;
    journey.hidden=true;miniAt-=dt;if(miniAt<=0&&!journey.hidden){miniAt=.3;const target=S.resolve(s,s.atlas.tracking);S.drawMap($('mini-map').getContext('2d'),s,{mini:true,path:s.village.interior?[]:path,selected:target,view:camera.view});$('mini-title').textContent=S.scope(s).name+(s.village.interior?' · 屋内':' · 点开地图');}
    const target=path.length?path[path.length-1]:S.resolve(s,s.atlas.tracking),indicator=$('route-compass');indicator.hidden=!target||!!s.village.interior;if(target){const dx=target.x-s.player.x,dy=target.y-s.player.y;indicator.textContent=(Math.abs(dx)>Math.abs(dy)?dx>0?'向东 →':'← 向西':dy>0?'向南 ↓':'向北 ↑')+' · '+(pending?.name||target.name||'地图目标')+(path.length?' · 行进中':' · 地图可继续带路');}
  }
  document.addEventListener('click',e=>{if(e.target.id!=='area-map'||inputLocked)return;const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*V.WIDTH,y=(e.clientY-r.top)/r.height*V.HEIGHT;S.pick(s,S.clickPoint(s,x,y,s.atlas.layer));renderPanel('map');});
  // Hide the panel without discarding its form values, show the world action, then dispatch once.
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||replayUI)return;if(inputLocked){e.stopImmediatePropagation();e.preventDefault();return;}if(['v-npc-talk','e-story-choice'].includes(b.dataset.action))return;const spec=Actions.ui(b.dataset.action,b.textContent.trim());if(!spec)return;
    e.stopImmediatePropagation();e.preventDefault();const prior=currentPanel,arg=panelArg,scroll=$('modal-body').scrollTop;
    if(b.dataset.action==='k-finish')b.dataset.actionHeat=parseFloat($('k-needle')?.style.left)||0;
    closePanel();path=[];pending=null;queuedDestination=null;farmQueue=[];ranchQueue=[];kitchenTask=null;buildTask=null;
    const restore=()=>{if(prior){currentPanel=prior;panelArg=arg;$('modal-overlay').hidden=false;$('game-root').classList.add('menu-open');$('modal-body').scrollTop=scroll;}};
    const giftTarget=prior==='gifts'?V.npcPoint(s,D.npcs.find(n=>n.id===arg)):null;
    startAction({...spec,item:b.dataset.id},giftTarget||s.player,()=>{currentPanel=prior;panelArg=arg;replayUI=true;try{b.click();}finally{replayUI=false;delete b.dataset.actionHeat;}if(currentPanel){$('modal-overlay').hidden=false;$('game-root').classList.add('menu-open');$('modal-body').scrollTop=scroll;}},restore);
  },true);
  W.restorePosition(s);camera.update(s,0,true);update();requestAnimationFrame(frame);
  if(!s.flags.introDone)openPanel('welcome');else if(startupNotice)toast(startupNotice,true);
  // Read-only snapshot for diagnostics; state mutations stay inside the game.
  window.ZRZSnapshot=()=>JSON.parse(JSON.stringify(s));
  window.ZRZView=()=>({...camera.view});
  window.ZRZDiagnostics=()=>JSON.parse(JSON.stringify({...diagnostics,action:sequence.snapshot(),navigation:{remaining:path.length,pending:pending?.kind||null},cache:window.ZRZVillageView.cacheStats()}));
  if(window.ZRZ_DEV)window.ZRZDeveloper={replace(next){s=C.load(next);W.restorePosition(s);save();update();camera.update(s,0,true);openPanel('debug');},state:()=>C.load(s),walk:travel,open:()=>openPanel('debug')};
})();
